<!doctype html>
<html lang="ko" data-bs-theme="lignt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈즈-메니저</title>
    <link rel="shortcut icon" href="/images/logo_homes_pro_32.png" type="image/x-icon">
    <link rel="icon" href="/images/logo_homes_pro_32.png" type="image/x-icon">

    <!-- bootstrap icon-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/html/manager/assets/css/styles.min.css" />
    <!--jQuery UI plugins -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/manager.css" />
    <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="ifrm-cont">
    <div class="cont-wrapper">
        <div class="cont-inner">
            <div class="cont">
                <h3 class="title bi bi-card-checklist">
                    홈즈프로 작업목록 ( REPT-0101 ) 
                </h3>
                <div class="search-wrap">
                    <div class="search-condi">
                        <div class="input-group">
                            <label for="lbl_stde" class="input-group-label">
                                <span class="bi bi-dot">시작일자</span>
                            </label>
                            <input type="text" class="form-control" id="p_stde" placeholder="yyyy.MM.dd" aria-label="시작일자 입력" aria-describedby="btn-stde-picker">
                            <span class="input-group-text border cursor-hand " id="btn_stde_picker">
                                <img src="/images/icon-datepicker.svg" />
                            </span>
                            <select id="p_sel_stde" class="form-select mx-1">
                                <option value="7D">일주일</option>
                            </select>
                            <div class="form-check">
                                <input type='checkbox' class='form-check-input' id="p_doneYn" value="Y" />
                                <label for="p_doneYn" class="form-check-label">완료포함</label>
                            </div>
                        </div>
                    </div>
                    <div class="search-button">
                        <button type="button" class="btn btn-primary" id="btn_search">
                            <span class="bi bi-search c-white"> 검색 </span>
                        </button>
                    </div>
                </div>
                <div class="table-cont">
                    <div class="summary py-2">
                        <!--
                        <span>완료: 0</span>
                        <span>/</span>
                        <span>전체: 0</span>
                        <span>진행률</span>
                        <span class="c-red">35.00</span>
                        <span>%</span>
                        -->
                    </div>
                    <div class="table">
                        <table class="table-List">
                            <colgroup>
                                <col width="80px" />
                                <col width="120px" />
                                <col width="150px" />
                                <col width="40px" />
                                <col width="150px" />
                                <col width="40px" />
                                <col width="150px" />
                                <col width="150px" />
                                <col width="150px" />
                                <col width="*" />
                            </colgroup>
                            <thead>
                                <tr>
                                    <th><span class="bi bi-check-square "></span></th>
                                    <th>작업코드</th>
                                    <th>Cate 01</th>
                                    <th></th>
                                    <th>Cate 02</th>
                                    <th></th>
                                    <th>Cate 03</th>
                                    <th>시작일시</th>
                                    <th>종료일시</th>
                                    <th>작업내역</th>
                                </tr>
                            </thead>
                            <tbody id="tb_data">
                                <tr id="tr_nodata">
                                    <td class="nodata" colspan="10">데이터가 존재하지 않습니다.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="btn-action">
                        <div class="btn-group">
                            <button class="btn btn btn-outline-gray" type="button" id="btn_add_row">
                                <i class="bi bi-clipboard-plus"></i>
                                추가
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="btn_save">
                                <i class="bi bi-floppy"></i>
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <form id="sfrm" name="sfrm" method="post" onsubmit="return false;">
        <input type="hidden" id="mcd" value="REPT0101" />
    </form>
    <script src="/js/common/homes-comm.js"></script>
    <!-- jqQuery 3.7.1 -->
    <script src="/js/extern/jquery-3.7.1.min.js"></script>
    <script src="/js/extern/jquery-ui-1.14.1/jquery-ui.js"></script>
    <script src="/html/manager/js/reports/REPT0101.js"></script>
    <script type="text/javascript">
        fn_start_page() ; 
    </script>
</body>
</html>
