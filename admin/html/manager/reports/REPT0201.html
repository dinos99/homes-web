<head>
  <meta charset="utf-8">

    <!-- bootstrap icon-->

<body class="ifrm-cont">
    <div class="cont-wrapper">
        <div class="cont-inner">
            <div class="cont">
                <h3 class="title bi bi-card-checklist">
                    주간 업무보고보고
                </h3>
                <div class="search-wrap">
                    <div class="search-condi">
                        <div class="input-group">
                            <select id="p_selweek" class="form-select w-100px">
                                <option value="">주차선택</option>
                            </select>
                            <input type="text" class="form-control" id="p_stde" placeholder="yyyy.MM.dd" aria-label="시작일자 입력" aria-describedby="btn-stde-picker">
                            <span class="input-group-text border cursor-hand " id="btn_stde_picker">
                                <img src="/images/icon-datepicker.svg" />
                            </span>
                            <button type="button" class="btn btn-primary" id="btn_search">
                                <span class="bi bi-search c-white"> 검색 </span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="table-cont">
                    <div class="summary">
                        <div class="summary-total">
                            <span>Total: </span>
                            <span id="h_grid_total" class="c-red">0</span>
                        </div>
                        <div class="summary-pager">
                            <span class="c-blue" id="h_grid_curr_pg">1</span>
                            <span>page</span>
                            <span class=""> / </span>
                            <span class="c-red" id="h_grid_total_pg">1</span>
                            <span class="">pages</span>
                        </div>
                    </div>
                    <div class="table">
                        <table id="h_grid"></table>
                        <div id="h_grid_pager" class="grid-pager">
                        </div>
                    </div>
                </div>
                <div class="action-button">
                    <button type="button" class="btn btn-outline-secondary" id="btn_create">주간보고 작성</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/common/homes-comm.js"></script>
    <!-- jqQuery 3.7.1 -->

        fn_start_page() ;
