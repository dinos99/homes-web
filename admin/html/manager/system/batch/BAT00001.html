<!doctype html>
<html lang="ko" data-bs-theme="lignt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈즈-메니저</title>
    <link rel="shortcut icon" href="/images/logo_homes_pro_32.png" type="image/x-icon">
    <link rel="icon" href="/images/logo_homes_pro_32.png" type="image/x-icon">

    <!-- bootstrap icon-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/html/manager/assets/css/styles.min.css" />

    <!--jQuery UI plugins -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <!-- jqGrid -->
    <link rel="stylesheet" type="text/css" href="/js/extern/jqgrid-4.6.0/css/ui.jqgrid.css" />

    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/manager.css" />
    <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="ifrm-cont">
    <div class="cont-wrapper">
        <div class="cont-inner">
            <div class="cont">
                <h3 class="title bi bi-database-check"> 배치실행결과 </h3>

                <div class="search-wrap">
                    <div class="search-condi">
                        <div class="input-group">
                            <select id="p_batchTy" class="form-select">
                                <option value="">배치유형선택</option>
                            </select>
                            <input type="text" class="form-control" id="p_batchde" placeholder="yyyy.MM.dd" aria-describedby="btn-stde-picker">
                            <span class="input-group-text border cursor-hand " id="btn_stde_picker">
                                <img src="/images/icon-datepicker.svg" />
                            </span>
                            <button type="button" class="btn btn-primary" id="btn_search">
                                <span class="bi bi-search c-white"> 검색 </span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="table-cont">
                    <div class="summary py-2">
                    </div>
                    <div class="table">
                        <table id="h_gridList"></table>
                        <!--
                        <div id="pager"></div>    
                        -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common/homes-comm.js"></script>
    <!-- jqQuery 3.7.1 -->
    <script src="/js/extern/jquery-3.7.1.min.js"></script>
    <script src="/js/extern/jquery-ui-1.14.1/jquery-ui.js"></script>
    <script src="/js/extern/jqgrid-4.6.0/js/i18n/grid.locale-kr.js" type="text/javascript"></script>
    <script src="/js/extern/jqgrid-4.6.0/js/minified/jquery.jqGrid.min.js" type="text/javascript"></script>
    <!--
    <script src="../../js/system/batch/REPT0001.js"></script>
    -->
    <script type="text/javascript">
        var jqHeaders = ['UUID', '배치유형', '배치상태', '시작일시', '종료일시', '실행건수', '배치메시지'];
        var jqModels  = [
            {name:'uuid'       , align:'left'  , width: '22%'},
            {name:'batchTy'    , align:'center', width: '8%'},
            {name:'btSttuscd'  , align:'center', width: '8%', formatter: (val, opt, row) => {
                if ( val == "BTS000" ) return "작업대기";
                else if ( val == "BTS001" ) return "작업중" ;
                else if ( val == "BTS002" ) return "작업완료" ; 
                else return val ; 
            }},
            {name:'btstDt'     , align:'center', width: '10%'},
            {name:'btedDt'     , align:'center', width: '10%'},
            {name:'btExco'     , align:'right' , width: '5%', formatter: (val, opt, row) => {
                return h_manager.util.fn_format_number(val) ;
            }},
            {name:'btErrormsg' , align:'left'  , width: '37%'},
        ];

        var fn_search = () => {
            var bt_stde = $("#p_batchde").val().split(".").join("") ; 
            h_manager.network.post("/batch/btjobList", {
                btstde: bt_stde,
                pgno: 1,
                numrows: 30
            }).then(response => {
                var dataList = response.data.dataList ; 
                if ( !!dataList && dataList.length > 0 ) {
                    fn_delete_total_row("h_gridList") ;
                    dataList.forEach(data => {
                        var rowid = $("#h_gridList").getGridParam("reccount"); // 페이징 처리 시 현 페이지의 Max RowId 값
                        $("#h_gridList").jqGrid("addRowData", rowid+1, data); // 첫행에 Row 추가
                    }) ; 
                } else {
                    debugger ;
                    fn_nodata() ; 
                }
            }) ;
        }

        var fn_delete_total_row = (id) => {
            var rcnt =$("#" + id).getGridParam("reccount") ;
            if ( rcnt > 0 ) {
                for ( var i = 1; i <= rcnt; i ++ ) {
                    $("#" + id).delRowData(i) ; 
                }
            }
        }
        var fn_nodata = () => {
            fn_delete_total_row("h_gridList") ;
            $("#h_gridList").addRowData(1, {}) ;

            for ( var i = 0; i < jqHeaders.length; i ++ ) {
//                var tds = $("#h_gridList").find("tr").eq(1).children() ; 
            }
        }

        $(function() {
            $("#h_gridList").jqGrid({
                datatype: "json",
                autowidth: true,
                rownumbers : true,
                height: 550,
                colNames: jqHeaders,
                colModel: jqModels
            });

            
            fn_nodata() ;

            var picker = h_manager.ui.fn_datepicker("p_batchde") ;
            picker.val(h_manager.util.fn_get_today()) ; 
            
            $("#btn_stde_picker").click(function() {
                $("#p_batchde").datepicker("show") ; 
            }) ;

            $("#btn_search").click(function() {
                fn_search() ; 
            }) ;
        });
    </script>
</body>
</html>
