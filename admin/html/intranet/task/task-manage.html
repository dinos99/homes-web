        <path fill-rule="evenodd" d="M2.146 2.146a.5.5 0 0 0 0 .708l11 11a.5.5 0 0 0 .708-.708l-11-11a.5.5 0 0 0-.708 0Z"></path>
      </symbol>
    </svg>
    <div class="homes-wrap"> 
      <!-- GNB Area -->
      <div class="header-wrap">
      </div>
      <div class="cont-area-wrap">
        <div class="nav-wrap">


          <div class="flex-shrink-0 p-3" style="width: 220px;">
            <a href="#" class="d-flex align-items-center pb-3 mb-3 link-body-emphasis text-decoration-none border-bottom">
              <!-- <svg class="bi pe-none me-2" width="30" height="24" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg> -->
              <span class="fs-5 fw-semibold">인트라넷</span>
            </a>
            <ul class="list-unstyled ps-0">
              <li class="mb-1">
                <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed" data-bs-toggle="collapse" data-bs-target="#collapse-01" aria-expanded="true">
                  프로젝트관리
                </button>
                <div class="collapse show" id="collapse-01">
                  <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded c-red">작업관리</a></li>
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">주간보고</a></li>
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">월간보고</a></li>
                  </ul>
                </div>
              </li>
              <li class="mb-1">
                <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed" data-bs-toggle="collapse" data-bs-target="#collapse-02" aria-expanded="false">
                  업무관리
                </button>
                <div class="collapse" id="collapse-02">
                  <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">조직관리</a></li>
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">인사관리</a></li>
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">휴가관리</a></li>
                  </ul>
                </div>
              </li>
              <li class="mb-1">
                <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed" data-bs-toggle="collapse" data-bs-target="#collapse-03" aria-expanded="false">
                  커뮤니티
                </button>
                <div class="collapse" id="collapse-03">
                  <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">공지사항</a></li>
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">SR 게시판</a></li>
                    <li><a href="#" class="link-body-emphasis d-inline-flex text-decoration-none rounded">업무연락</a></li>
                  </ul>
                </div>
              </li>
              <li class="border-top my-3"></li>
            </ul>
          </div>





        </div>
        <div class="content-wrap">
          <div class="title-wrap">
            <h4>작업관리 등록</h4>
          </div>
          <div class="cont-wrap">
            <div class="row g-5">
              <div class="col-md-7 col-lg-8">
                <form class="needs-validation" novalidate="">
                  <div class="row g-3">
                    <div class="col-sm-12">
                      <label for="firstName" class="form-label required">Task 제목</label>
                      <input type="text" class="form-control" id="task_nm" placeholder="Task 제목을 입력해 주세요." value="" required="">
                      <div class="invalid-feedback">Task 제목을 입력해 주세요.</div>
                    </div>
        
                    <div class="col-3">
                      <label for="p_cher_nm" class="form-label required">담당자 지정</label>
                      <div class="input-group has-validation">
                        <input type="text" class="form-control" id="p_cher_nm" value="" placeholder="담당자" required="">
                        <input type="hidden" id="p_userno" value="" />
                        <span class="input-group-text cursor-hand" id="btn_cher_nm">
                          <img src="/images/icon-dark-search.svg" width="16" height="16" class="bi bi-calendar3" />
                        </span>
                        <div class="invalid-feedback">담당자를 지정해 주세요</div>
                      </div>
                    </div>
        
                    <div class="col-3">
                      <label for="taskSttus" class="form-label required">작업 진행상태</label>
                      <select class="form-select" id="taskSttus">
                        <option>미진행</option>
                        <option>진행중</option>
                        <option>지연</option>
                        <option>작업완료</option>
                      </select>
                    </div>
        
                    <div class="col-3">
                      <label for="p_task_stde" class="form-label required">Task 작업시작일</label>
                      <div class="input-group has-validation">
                        <input type="text" class="form-control" id="p_task_stde" placeholder="YYYY.MM.DD" required="">
                        <span class="input-group-text cursor-hand" id="btn_task_stde">
                          <img src="/images/icon-dark-calendar.svg" width="16" height="16" class="bi bi-calendar3" id="btn_task_stde"/>
                        </span>
                        <div class="invalid-feedback">
                          Task 작업시작일을 입력해주세요.
                        </div>
                      </div>
                    </div>
        
                    <div class="col-3">
                      <label for="p_task_edde" class="form-label required">
                        Task 작업종료일
                        <span class="text-body-secondary">(예상)</span>
                      </label>
                      <div class="input-group has-validation">
                        <input type="text" class="form-control" id="p_task_edde" placeholder="YYYY.MM.DD" required="">
                        <span class="input-group-text cursor-hand" id="btn_task_edde">
                          <img src="/images/icon-dark-search.svg" width="16" height="16" class="bi bi-calendar3" />
                        </span>
                        <div class="invalid-feedback">
                          Task 작업종료일을 입력해주세요.
                        </div>
                      </div>                    
                    </div>

                  </div>

                  <hr class="my-4">
                  <div class="row g-3">
                    <div class="col-3">
                      <label for="p_task_prefix" class="form-label">Task prefix</label>
                      <input type="text" class="form-control" id="p_task_prefix" placeholder="TSK" value="" required="">
                    </div>
        
                    <div class="col-9">
                      <label for="p_task_prefix_nm" class="form-label">Task prefix</label>
                      <input type="text" class="form-control" id="p_task_prefix_nm" placeholder="Task 프리픽스 명" value="" required="">
                    </div>
                    <div class="col-12">
                      <label for="p_upper_task_cd" class="form-label">상위 Task</label>
                      <div class="input-group has-validation">
                        <input type="text" class="form-control" id="p_upper_task_cd" placeholder="" value="" required="">
                        <span class="input-group-text cursor-hand">
                          <img src="/images/icon-dark-search.svg" width="16" height="16" class="bi bi-calendar3" id="btn_task_upper_cd"/>
                        </span>
                      </div>
                    </div>
                  </div>

                  <div class="row g-3 mt-1">
                    <div class="col-8">&nbsp;</div>
                    <div class="col-2">
                      <button class="w-100 btn btn-primary" type="button">저장</button>
                    </div>
                    <div class="col-2">
                      <button class="w-100 btn btn-secondary" type="button">취소</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>


          </div>
        </div>
      </div>
      <div class="bottom-area-wrap">

      </div>

    <script src="/js/intranet/task/task-manage.js"></script>
