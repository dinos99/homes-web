  <script type="text/javascript">
    /* fn_page_onLoad 보다 먼저호출해야 함 */ 
    fn_setpage({
          pageid: "SYST-0003-002"
    }) ;
    /*

        <th>기타용도</th>
        <th>세대수</th>
        <th>가구수</th>
        <th>생성일자</th>
        <th>등록일자</th>
    */
    fn_dosearch = () => {
      homes_grid.send_grid("/api/v1/system/totalLedger", {
          grid: {
              id: "grid_total_Ledgr"
                , headers: [   
                    { id: "regstrpk"     , clsname: "tal" }
                    , { id: "regstrgbnm" , clsname: "tac" }
                    , { id: "nwodgbnm"   , clsname: "tac" }                    
                    , { id: "buldnm"     , clsname: "tal" }
                    , { id: "mppsnm"     , clsname: "tal" }
                    , { id: "etcpps"     , clsname: "tal" }
                    , { id: "hshldco"    , clsname: "tar", "format": util.fn_format_number }
                    , { id: "fmlyco"     , clsname: "tar", "format": util.fn_format_number }
                    , { id: "creatde"    , clsname: "tac", "format": util.fn_format_date }
                    , { id: "regstrde"   , clsname: "tac" }
                ]
                , div_result : "grid_result"
                , paging: {
                    id: "grid_paging"
                    , useYn: true
                }
            }
            , param: {
                "pgno": 1,
                "btstDe": $("#p_btstDe").val().split(".").join("")
            }
        }).then(result => {
        }).catch(error => {
          message.alert(error.errorMessage) ; 
        }) ; 
    }

    /* 페이지 이번트 */
    var fn_page_onLoad = () => {
        fn_isLogin() ; /* 로그인여부판단 ( 토큰이 없으면 로그인페이지로 튕김 ) */ 
        fn_homes_admin_init() ; /* GNB, LNB 초기화 */ 
        homes_grid.init_grid({
            gid: "grid_total_Ledgr" /* grid id */
            , rid: "grid_result" /* grid result-set id */ 
            , paging: {
                id: "grid_paging"
                , useYn: true
            }
        }) ;

        $("#btn_search").click(function() {
          fn_dosearch() ; 
        })

        homes_ui.datepicker( "p_btstDe", "btn_btstDe" ) ; 
        $("#p_btstDe").val(util.fn_get_today()) ;
    }
  </script>
