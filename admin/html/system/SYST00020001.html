  <script defer src="/assets/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

  <script type="text/javascript">
    var popinfo = {} 

    var p_bjtList = {
      "BJT000": { "nm": "파일분할" },
      "BJT001": { "nm": "단지정보입력" },
      "BLD001": { "nm": "기본개요" },
      "BLD002": { "nm": "총괄표제부" },
      "BLD003": { "nm": "표제부" },
    }

    var p_sttusList = {
      "BTS000": { "nm": "작업대기" },
      "BTS001": { "nm": "작업처리중" },
      "BTS002": { "nm": "작업완료" },
      "BTS999": { "nm": "작업에러" },
    }

    /* fn_page_onLoad 보다 먼저호출해야 함 */ 
    fn_setpage({
          pageid: "SYST-0002-0001"
    }) ;

    /* upload popup close */
    fn_pop_close = ( popnm ) => {
        $("#pop-upload-batchfile").removeClass("hidden").addClass("hidden") ; 
    }

    /* upload popup open */
    fn_pop_open = ( popnm ) => {
        $("#pop-upload-batchfile").removeClass("hidden") ;  
        var batchTy = $("#p_batchTy").val() ; 
        if ( !!!batchTy ) {
          message.alert("배치유형을 선택하여 주세요") ; 
          return false ; 
        }
        var pop_title = "" ; 
        if ( batchTy == "BJT001") {
          pop_title = "총괄표제부파일 업로드 "
        }
        $("#btn_build_upload").val(pop_title) ;
        $("#pop_build_title").text(pop_title) ;

    }

    fn_get_message = ( jobid, exco ) => {
      if ( jobid == "BJT000" ) {
        if ( !!!exco || exco == 0 ) return "분할대상파일이 없습니다." ; 
        else return homes_comm.util.fn_format_number(exco) + "건 분할완료" ;
      } else if ( jobid == "BJT001") {
        if ( !!!exco || exco == 0 ) return "신규등록할 단지정보가 없습니다." ; 
        else return homes_comm.util.fn_format_number(exco) + "건 등록완료" ;
      } else {
        if ( !!!exco || exco == 0 ) return "작업대상파일이 없습니다." ; 
        else return homes_comm.util.fn_format_number(response.data.exco) + "건 분할완료" ; 
      }
    }
    fn_doExecute = () => {
        var jobid = $("#p_batchTy").val() ; 
        network.send("/api/v1/batch/execute", {}, {
          "jobid"  : jobid,
          "batchYn": "N"
        }).then(response => {
          console.log(response) ;
          var res_message = fn_get_message(jobid, response.data.exco) ; 
          message.alert(res_message).then(ok => {
            fn_dosearch() ;
          }) ;
        }).catch( error => {
          console.log(error) ; 
          message.alert(error.errorMessage) ; 
        }) ; 
    }

    fn_get_formdata = () => {
        var formData = new FormData() ;
        formData.append("batchType", "BJT001") ;
        formData.append("buildfile", $("#f_buildup")[0].files[0] , $("#f_buildup")[0].files[0].name) ; 
        return formData ; 
    }

    fn_doUpload = () => {
      var formData = fn_get_formdata() ;
      return new Promise((resolve, reject) => {
          homes_comm.network.send("/api/v1/manager/batchUpload", {
              "headers": {
                  "Content-Type": "multipart/form-data"
              }
              , "body": formData
          }).then(response => {
            var data = response.data ; 
            var up_co = data["upCo"] || 0 ; 
            if ( up_co > 0 ) {
              message.alert(up_co + "개의 파일로 분할되었습니다.", {
                "title": "첨부파일 분할결과"
              }).then(ok => {
                fn_pop_close("build") ; 
              }) ; 
            }
          }).catch(e => {
          }) ; 

      }) ; 
    }

    fn_dosearch = () => {
      homes_grid.send_grid("/api/v1/batch/btjobList", {
          grid: {
              id: "grid_btjobList"
                , headers: [   
                    { id: "batchno"        , clsname: "tar" }
                    , { id: "batchTy"      , clsname: "tac", code: p_bjtList }
                    , { id: "btSttuscd"    , clsname: "tac", code: p_sttusList }
                    , { id: "btstDt"       , clsname: "tac" }
                    , { id: "btedDt"       , clsname: "tac" }
                    , { id: "btExco"       , clsname: "tar", "format": util.fn_format_number }
                    , { id: "btFilenm"     , clsname: "tal" }
                    , { id: "btErrormsg"   , clsname: "tal" }
                ]
                , div_result : "grid_result"
                , paging: {
                    id: "grid_paging"
                    , useYn: true
                }
            }
            , param: {
                "pgno": 1,
                "btstDe": $("#p_btstDe").val().split(".").join("")
            }
        }).then(result => {
        }).catch(error => {
          message.alert(error.errorMessage) ; 
        }) ; 
    }

    /* 페이지 이번트 */
    var fn_page_onLoad = () => {
        fn_isLogin() ; /* 로그인여부판단 ( 토큰이 없으면 로그인페이지로 튕김 ) */ 
        fn_homes_admin_init() ; /* GNB, LNB 초기화 */ 
        homes_grid.init_grid({
            gid: "grid_btjobList" /* grid id */
            , rid: "grid_result" /* grid result-set id */ 
            , paging: {
                id: "grid_paging"
                , useYn: true
            }
        }) ;

        $("#btn_upload").click(function() {
          var batchTy = $("#p_batchTy").val() ; 
          if ( !!!batchTy ) {
            message.alert("배치유형을 선택하여 주세요") ; 
            return false ; 
          } else {
            $("#pop-upload-batchfile").removeClass("hidden") ;  
            fn_pop_open("build") ; 
          }
        }) ; 

        $("#btn_doExecute").click(function() {
          var batchTy = $("#p_batchTy").val() ; 
          if ( !!!batchTy ) {
            message.alert("배치유형을 선택하여 주세요") ; 
            return false ; 
          } else {
            message.confirm("배치를 실행하시겠습니까?")
            .then(confirm => {
              fn_doExecute() ; 
            }) ;
          }
        }) ; 

        $(".btn-close").click(function() {
          fn_pop_close("build") ; 
        }) ; 

        $("#btn_cancel").click(function() {
          fn_pop_close("build") ; 
        }) ; 

        $("#btn_build_upload").click(function() {
            $("#f_buildup").click() ; 
        })
        $("#span_btn_build_upload").click(function() {
            $("#f_buildup").click() ; 
        }) ;

        $("#f_buildup").change(function() {
            $("#span_upload_target").removeClass("hidden") ; 
            var fsize = $(this)[0].files[0].size ; 
            var lsize = 5 * 1024 * 1045 ; /* 5MB */
            
            var conv_size = util.fn_conv_filesize(fsize, { use_full_unit_size: true }) ;
            $("#span_upload_target").children().eq(0).children().eq(1).text($(this)[0].files[0].name ) ;
            $("#span_upload_target").children().eq(1).children().eq(0).text(conv_size) ;
                  $("#btn_split").removeClass("hidden") ; 
            if ( fsize > lsize ) {
                $("#span_upload_target").children().eq(1).children().eq(0).addClass("c-red") ; 
                message.confirm("대용량 파일을 선택하셨습니다. <br/> 파일을 분할하히겠습니까?")
                .then(ok => {
                }).catch( cancel => {
                }) ; 
            }

        }) ;

        $("#btn_split").click(function() {
          fn_doUpload() ;
        }) ; 

        $("#btn_search").click(function() {
          fn_dosearch() ; 
        })

        homes_ui.datepicker( "p_btstDe", "btn_btstDe" ) ; 
        $("#p_btstDe").val(util.fn_get_today()) ;
    }
  </script>
