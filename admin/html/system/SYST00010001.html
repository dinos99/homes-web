                <div class="modal-sheet" tabindex="-1" role="dialog" id="pop_domain_colclose">

                            <div class="modal-header rounded-4">
                                <h1 class="modal-title fs-5" id="pop_domain_title">도메인 등록</h1>
                                <button type="button" class="btn-close" id="btn_domain_colclose" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-border-bottom"></div>
                            <div class="modal-body">
                                <div class="modal-cont">
                                    <div class="div-table">
                                        <table class="table-list">
                                            <colgroup>
                                                <col width="25%"></cols>
                                                <col width="*"></cols>
                                            </colgroup>
                                            <tbody>
                                                <tr>
                                                    <th class="tal px-3"><label class="form-label mb-0 pre-required"><strong class="fs-18px">컬럼 명(물리)</strong></label></th>
                                                    <td class="tal px-3" id="td_colnm"></td>
                                                </tr>

                                                    <th class="tal px-3"><label class="form-label mb-0 pre-required"><strong class="fs-18px">컬럼 명(논리)</strong></label></th>

                                                </tr>
                                                <tr>
                                                    <th class="tal px-3"><label class="form-label mb-0 pre-required"><strong class="fs-18px">컬럼 크기</strong></label></th>
                                                    <td class="tal px-3" id="td_colsize"></td>
                                                </tr>
                                                <tr>
                                                    <th class="tal px-3"><label class="form-label mb-0"><strong class="fs-18px">컬럼 대이터 유형</strong></label></th>
                                                    <td class="tal px-3" id="td_dataTy">
                                                        <select id="p_dataTy" class="form-select w-200px">
                                                            <option value="VARCHAR">VARCHAR</option>
                                                            <option value="CHAR">CHAR</option>
                                                            <option value="INT">INT</option>
                                                            <option value="FLOAT">FLOAT</option>
                                                            <option value="DATETIME">DATETIME</option>
                                                        </select>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <th class="tal px-3"><label class="form-label mb-0"><strong class="fs-18px">컬럼 대이터 사이즈</strong></label></th>

                                                        </div>
                                                    </td>

    <script defer src="/assets/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"></script>

  <script type="text/javascript">

    var _dataList = [] ; 

    /* fn_page_onLoad 보다 먼저호출해야 함 */ 
    fn_setpage({
          pageid: "SYST-0001-0001"
    }) ;

    fn_open_regcols = ( row, data ) => {
        $("#pop-regist-collums").removeClass("hidden") ;
        $("#pop_domain_title").text("도메인 수정") ;
        $("#td_colnm").text(data.colnm) ; 
        $("#td_colsize").text(data.colsize) ;
        $("#p_colcomment").val(data.colcomment) ; 
        $("#p_ismodify").val("Y") ; 

        if ( !!data["coldataTy"] ) {
            $("#p_dataTy").val(data["coldataTy"]) ; 
        }
        if ( !!data["coldataSize"] ) {
            $("#p_dataSize").val(data["coldataSize"]) ; 
        }
        $("#p_row").val(row) ;
    }

    fn_modify_column= () => {
      var is_modify = "Y" ;
      var sourcecd  = $("#p_source").val() ; 
      var sourcenm  = sourcecd == "01" ? "자체등록" : "행안부 표준용어사전" ;
      network.send("/api/v1/system/modifydomain", {}, {
        "ismodify"      : is_modify
        , "colnm"       : $("#td_colnm").text()
        , "colcomment"  : $("#p_colcomment").val() 
        , "coldataTy"   : $("#p_dataTy").val()
        , "coldataSize" : $("#p_dataSize").val()
        , "colsize"     : $("#td_colsize").text()
        , "sourcecd"    : sourcecd
        , "sourcenm"    : sourcenm
        , "creatid"     : "brotherda9"
      }).then(response => {
        var row = $("#p_row").val() ;
        debugger ;
      }) ; 
    }

    fn_domainList = () => {
        homes_grid.send_grid("/api/v1/system/domainList", {
            grid: {
                id: "grid_domainList"
                , headers: [   
                    { id: "rnum"           , clsname: "tar" }
                    , { id: "colnm"        , clsname: "tal", "fn_link_click": fn_open_regcols }
                    , { id: "colcomment"   , clsname: "tal" }
                    , { id: "colsize"      , clsname: "tal" }
                    , { id: "coldataTy"    , clsname: "tac" }
                    , { id: "coldataSize"  , clsname: "tac" }
                    , { id: "sourcenm"     , clsname: "tac" }
                    , { id: "creatde"      , clsname: "tac" }
                    , { id: "creatid"      , clsname: "tac" }
                ]
                , div_result : "grid_result"
                , paging: {
                    id: "grid_paging"
                    , useYn: true
                }
            }
            , param: {
                "pgno": 1
            }
        }).then(result => {
            var _dataList = result.dataList ;
            $("a[id$=colnm]").click(function() {
                var id = $(this).attr("id") ; 
                var row = $(this).attr("id").split("_").splice(1, 1)[0] ; 
                fn_open_regcols.apply(null, [row, _dataList[row]]) ; 
            }) ; 
        }) ;
    }

    
    fn_pop_colclose = (button) => {
        $("#pop-regist-collums").removeClass("hidden").addClass("hidden") ;
    } ;

    /* 페이지 이번트 */
    var fn_page_onLoad = () => {
        fn_isLogin() ; /* 로그인여부판단 ( 토큰이 없으면 로그인페이지로 튕김 ) */ 
        fn_homes_admin_init() ; /* GNB, LNB 초기화 */ 
        homes_grid.init_grid({
            gid: "grid_domainList" /* grid id */
            , rid: "grid_result" /* grid result-set id */ 
            , paging: {
                id: "grid_paging"
                , useYn: true
            }
        }) ;
        $("#btn_search").click(function() {
            fn_domainList() ; 
        }) ;

        $("#btn_create").click(function() {
          location.href="/html/system/SYST00010002.html" ;
        }) ; 

        $("#btn_domain_colclose").click(function() {
          fn_pop_colclose("domain") ; 
        }) ; 

        $("#btn_domain_cancel").click(function() {
          fn_pop_colclose("domain") ; 
        }) ; 
        $("#btn_domainok").click(function() {
          fn_modify_column() ;
        }) ; 
        
        $("#btn_conf_colsize").click(function() {
          var p_datasize = $("#p_dataSize").val() ;
          if ( !!!p_datasize ) {
            message.alert("컬럼 데이터크기를 입력해 주세요") ; 
            return false ;
          }
          var dataTy = $("#p_dataTy").val() ;
          if ( dataTy == "DATETIME") {
            $("#td_colsize").text(dataTy) ;
          } else {
            $("#td_colsize").text(dataTy + "("  + p_datasize + ")") ; 
          }
        }) ; 
    }

  </script>
