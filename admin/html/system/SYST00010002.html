  <script defer src="/assets/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"></script>

  <script type="text/javascript">
    var coldata = []
    /* fn_page_onLoad 보다 먼저호출해야 함 */ 
    fn_setpage({
          pageid: "SYST-0001-0002"
    }) ;

    fn_pop_colclose = (button) => {
      if ( button == "col" ) {
        $("#pop-text-collums").removeClass("hidden").addClass("hidden") ;
      } else {
        $("#pop-regist-collums").removeClass("hidden").addClass("hidden") ;
      }

    } ;

    fn_check_columns = () => {
      $("#pop-text-collums").removeClass("hidden") ;
    }

    fn_open_regcols = ( row ) => {
      $("#pop-regist-collums").removeClass("hidden") ;
      var existsYn = row.existsYn ; 
      if ( existsYn == "Y" ) {
        $("#pop_domain_title").text("도메인 수정") ;
        $("#td_colnm").text(row.colnm) ; 
        $("#td_colsize").text(row.colsize) ;
        $("#p_colcomment").val(row.colcomment) ; 

        $("#p_ismodify").val("Y") ; 
      } else {
        $("#pop_domain_title").text("도메인 등록") ;
        $("#td_colnm").text(row.colnm) ; 
        $("#td_colsize").text("") ;
        $("#p_colcomment").val(row.colcomment) ; 
        $("#p_ismodify").val("N") ; 
      }

    }

    fn_modify_column= () => {
      var is_modify = $("#p_ismodify").val() ;
      var sourcecd  = $("#p_source").val() ; 
      var sourcenm  = sourcecd == "01" ? "자체등록" : "행안부 표준용어사전" ;
      network.send("/api/v1/system/modifydomain", {}, {
        "ismodify"      : is_modify
        , "colnm"       : $("#td_colnm").text()
        , "colcomment"  : $("#p_colcomment").val() 
        , "coldataTy"   : $("#p_dataTy").val()
        , "coldataSize" : $("#p_dataSize").val()
        , "colsize"     : $("#td_colsize").text()
        , "sourcecd"    : sourcecd
        , "sourcenm"    : sourcenm
        , "creatid"     : "brotherda9"
      }).then(response => {
      }) ; 
    }

    fn_get_defaultVal = (i, row) => {
      /* 첫행은 반드시 PK로입력 */ 
      if ( i == 0 ) return "NOT NULL "

      var colsize = "_" + row.colsize ; 
      /* int 혹은 float은 default 0 추가 */
      if ( colsize.indexOf("INT") > 0 || colsize.indexOf("FLOAT") > 0) {
        return 'DEFAULT 0 ' ; 
      }
      /* 컬럼명 default value */ 
      if ( row.colnm == "BATCH_YN") return "DEFAULT \'Y\' "  ;
      else if ( row.colnm == "FST_UPLOAD_DT") return "DEFAULT NOW() " ; 
      else if ( row.colnm == "LST_CHNG_DT")   return "DEFAULT NOW() " ; 
      else if ( row.colnm == "CREAT_DT")      return "DEFAULT NOW() " ; 
      else if ( row.colnm == "UPDT_DT")       return "DEFAULT NOW() " ; 
      else return "NULL " ;
    }
    fn_ddl_generate = () => {
      var tblname = $("#p_tablename").val() ;
      if ( !!!tblname ) {
        message.alert("테이블명을 입력해 주세요") ; 
        return false ;
      }

      if ( !coldata || coldata.length == 0 ) {
        message.alert("컬럼명확인을 먼저 실행해 주세요") ; 
        return false ;
      }

      tblname = tblname.toUpperCase() ;
      var ddl = "CREATE TABLE " + tblname + " (\r\n" ; 
      for ( var i = 0; i < coldata.length; i ++ ) {
        var row = coldata[i] ; 
        if ( i == 0 ) {
          ddl += "\t\t" + row.colnm  + " " + row.colsize + " " + fn_get_defaultVal(i, row) + " COMMENT '"  + row.colcomment + "' \r\n";
        } else {
          ddl += "\t\t, " + row.colnm  + " " + row.colsize + " " + fn_get_defaultVal(i, row) + " COMMENT '"  + row.colcomment + "' \r\n";
        }
      }
      ddl += ") ENGINE=InnoDB DEFAULT CHARSET=utf8mb3 COLLATE=utf8mb3_general_ci;"
      $("#txt_colnmList").val(ddl) ;
      $("#btn_colok").removeClass("hidden").addClass("hidden") ; 
      fn_check_columns() ;
    }

    fn_create_row = ( data ) => {
      coldata = [] ; 
      $("#tbody_textcol_List").empty() ; 
      data.forEach((row, i) => {
        var tr = $("<tr/>") ; 

        var rownum = Number(i) + 1 ; 
        row.rownum = rownum ; 
        var td_rnum = `<td class="tar">${rownum}</td>` ; 
        tr.append($(td_rnum)) ; 

        var cred = "" ; 
        if (row.existsYn != "Y") cred = "c-red" ;
        var td_colnm = `<td class="tal"><span class='${cred}'>${row.colnm}</span></td>` ; 
        tr.append($(td_colnm)) ; 

        if (row.existsYn != "Y") cred = "c-red" ;
        var colcomment = !!row.colcomment ? row.colcomment : "" ; 
        var td_comment = `<td class="tal"><span class='${cred}'>${colcomment}</span></td>` ; 
        tr.append($(td_comment)) ; 

        var colsize = !!row.colsize ? row.colsize : "" ; 
        var td_colsize = `<td class="tal">${colsize}</td>` ; 
        tr.append($(td_colsize)) ; 
        
        var dataTy = !!row.coldataTy ? row.coldataTy : "-" 
        var td_coldataTy = `<td class="tac">${dataTy}</td>` ; 
        tr.append($(td_coldataTy)) ; 
        
        var dataSize = !!row.coldataSize ? row.coldataSize : "-" 
        var td_coldataSize = `<td class="tac">${dataSize}</td>` ; 
        tr.append($(td_coldataSize)) ; 
        
        var sourcenm = !!row.sourcenm ? row.sourcenm : "-" 
        var td_sourcenm = `<td class="tac">${sourcenm}</td>` ; 
        tr.append($(td_sourcenm)) ; 
        
        var crde = util.fn_format_date( row.creatde ) ; 
        var td_creatde = `<td class="tac">${crde}</td>` ; 
        row.crde = crde ; 
        tr.append($(td_creatde)) ; 
        
        var creatid = !!row.creatid ? row.creatid : "-"
        var td_creatid = `<td class="tac">${creatid}</td>` ; 
        tr.append($(td_creatid)) ; 

        if (row.existsYn != "Y") cred = "c-red" ;
        var td_existsYn = `<td class="tac"><span class='${cred}'>${row.existsYn}</span></td>` ; 
        tr.append($(td_existsYn)) ; 

        var button = $("<button type='button' class='btn btn-sm bi-check-circle-fill' />") ; 
        if ( row.existsYn == "Y") {
          button.addClass("btn-success") ; 
        } else {
          button.addClass("btn-primary") ; 
        }
        button.click(function() {
          fn_open_regcols(row) ;
        }) ;
        var td_button = $("<td class='tac' />") ;
        td_button.append(button) ;
        tr.append($(td_button)) ; 

        $("#tbody_textcol_List").append(tr) ; 
        coldata.push(row) ;
      }) ; 
    }


    fn_textcols = (cols, colcmmnts) => {
      fn_pop_colclose("col") ;
      var columns = [] ; 
      cols.forEach((col, i)  => {
        if ( !!col ) {
          var coldata = {
            colnm: col
            , colcomment: colcmmnts[i]
          }
          columns.push(coldata) ;
        }
      }) ; 

      network.send("/api/v1/system/exdomainList", {}, {
        "domainList": columns
      }).then(response => {
        fn_create_row(response.data) ; 
      }) ;
    } ;

    /* 페이지 이번트 */
    var fn_page_onLoad = () => {
        fn_isLogin() ; /* 로그인여부판단 ( 토큰이 없으면 로그인페이지로 튕김 ) */ 
        fn_homes_admin_init() ; /* GNB, LNB 초기화 */ 

        $("#btn_goList").click(function() {
            message.confirm("목록페이지로 이동하시겠습니까?")
            .then(ok => {
              location.href="/html/system/SYST00010001.html"
            }) ; 
        }) ;

        $("#btn_colclose").click(function() {
          fn_pop_colclose("col") ; 
        }) ;

        $("#btn_domain_colclose").click(function() {
          fn_pop_colclose("domain") ; 
        }) ; 

        $("#btn_check_columns").click(function() {
          $("#btn_colok").removeClass("hidden") ; 
//          $("#txt_colnmList").val("") ;
//          $("#txt_colcommentList").val("") ;
          fn_check_columns() ;
        }) ;

        $("#btn_col_cancel").click(function() {
          fn_pop_colclose("col") ; 
        }) ;

        $("#btn_domain_cancel").click(function() {
          fn_pop_colclose("domain") ; 
        }) ; 

        $("#btn_colok").click(function() {
          var colsList = $("#txt_colnmList").val().split("\n") ; 
          var colcmmntList = $("#txt_colcommentList").val().split("\n") ; 
          fn_textcols ( colsList, colcmmntList ) ; 
        })

        $("#btn_generate").click(function() {
          fn_ddl_generate() ;
        }) ;

        $("#btn_conf_colsize").click(function() {
          var p_datasize = $("#p_dataSize").val() ;
          if ( !!!p_datasize ) {
            message.alert("컬럼 데이터크기를 입력해 주세요") ; 
            return false ;
          }
          var dataTy = $("#p_dataTy").val() ;
          if ( dataTy == "DATETIME") {
            $("#td_colsize").text(dataTy) ;
          } else {
            $("#td_colsize").text(dataTy + "("  + p_datasize + ")") ; 
          }
        }) ; 

        $("#p_dataTy").change(function() {
          var dataTy = $(this).val() ; 
          if ( dataTy == "DATETIME") {
            $("#p_dataSize").val("") ;
            $("#p_dataSize").attr("disabled", "disabled") ; 
            $("#btn_conf_colsize").attr("diabled", "disabled") ; 
          } else {
            $("#p_dataSize").val("") ;
            $("#p_dataSize").removeAttr("disabled") ; 
            $("#btn_conf_colsize").removeAttr("disabled") ; 
          }
        }) ; 
        $("#btn_domainok").click(function() {
          fn_modify_column() ;
        }) ; 
    }
  </script>
