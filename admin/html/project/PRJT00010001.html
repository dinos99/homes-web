  <script type="text/javascript">

    /* fn_page_onLoad 보다 먼저호출해야 함 */ 
    fn_setpage({
          pageid: "PRJT-0001-0001"
    }) ;

    fn_gridList = (data) => {
        if ( data.t_cnt > 0 && data.dataList.length > 0 ) {
            $("#row_0").removeClass("hidden").addClass("hidden") ;
            var dataList = data.dataList ; 
            var tbody = $("#tbody_user_List") ;
            var order = data.order ; 
            var t_cnt = data.t_cnt ; 

            $("#em_t_cnt").text(t_cnt) ;
            $("#em_pgno").text(data.pgno) ; 
            $("#em_l_pageno").text(data.l_pageno) ;

            dataList.forEach((data, i) => { 
                var r_idx = Number((($("#p_pgno").val() - 1 ) * 10 ) / 10)  + 1 + i ; 
                var r_num = order == "DESC" ? t_cnt - i  : r_idx ;
                
                var trHtml = `<tr id="row_${r_num}"/>` ; 
                var tr = $(trHtml) ; 

                var tdHtml = `<td id="cell_rnum_${r_num}">${r_num}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;
                
                var tdHtml = `<td id="cell_userno_${r_num}">${data.userno}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;

                var tdHtml = `<td id="cell_usernm_${r_num}">${data.usernm}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;
                
                var tdHtml = `<td id="cell_email_${r_num}"">${data.email}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;
                
                var tdHtml = `<td id="cell_usertynm_${r_num}"">${data.usertynm}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;

                var tdHtml = `<td id="cell_usersttusnm_${r_num}"">${data.usersttusnm}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;

                var tdHtml = `<td id="cell_logntynm_${r_num}"">${data.logntynm}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;
                
                var tdHtml = `<td id="cell_passwordchgdt_${r_num}"">${data.passwordchgdt}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;

                var tdHtml = `<td id="cell_lginfailco_${r_num}"">${data.lginfailco}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;

                var lasgLognDt = !!data.lastlogndt ? data.lastlogndt : "-" ;  
                var tdHtml = `<td id="cell_lastlogndt_${r_num}"">${lasgLognDt}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;

                var tdHtml = `<td id="cell_frstsbscrbdt_${r_num}"">${data.frstsbscrbdt}</td>` ; 
                var td = $(tdHtml) ;
                tr.append(td) ;

                tbody.append(tr) ;
            }) ; 
        } else {
            $("row_0").removeClass("hidden") ;
        }
    }

    fn_userList = () => {
        network.send("/api/v1/project/homesuserList", {
        }, {
            "pgno": 1
        }).then(response => {
            fn_gridList(response.data)
        }).catch(e => {
            message.alert(e.errorMessage, {
                title: `<strong>[<span class='c-red'>Error-${e.httpSttusCd}</span>] API호출실패 </strong>`
            }) ; 
        }) ;
    }

    /* 페이지 이번트 */
    var fn_page_onLoad = () => {
        fn_isLogin() ; /* 로그인여부판단 ( 토큰이 없으면 로그인페이지로 튕김 ) */ 
        fn_homes_admin_init() ; /* GNB, LNB 초기화 */ 

        $("#btn_search").click(function() {
            fn_userList() ; 
        }) ;
    }

  </script>
