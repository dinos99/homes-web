  <script type="text/javascript">

    /* fn_page_onLoad 보다 먼저호출해야 함 */ 
    fn_setpage({
          pageid: "PRJT-0003-0001"
    }) ;


    fn_userList = () => {
        homes_grid.send_grid("/api/v1/project/homesuserList", {
            grid: {
                id: "grid_userList"
                , headers: [   
                    { id: "rnum"           , clsname: "tar" }
                    , { id: "userno"       , clsname: "tar"  }
                    , { id: "usernm"       , clsname: "tac"  }
                    , { id: "email"        , clsname: "tal"  }
                    , { id: "usertynm"     , clsname: "tac"  }
                    , { id: "usersttusnm"  , clsname: "tac"  }
                    , { id: "logntynm"     , clsname: "tac"  }
                    , { id: "passwordchgdt", clsname: "tac"  }
                    , { id: "lognfailco"   , clsname: "tar", defval: 0 }
                    , { id: "lastlogndt"   , clsname: "tac", defval: "-" }
                    , { id: "frstsbscrbdt" , clsname: "tac" }
                ]
                , div_result : "grid_result"
                , paging: {
                    id: "grid_paging"
                    , useYn: true
                }
            }
            , param: {
                "pgno": 1
            }
        }).then(result => {
        }) ;
    }

    var fn_open_uploadPop = () => {
        popup.open_popup("pop_build_upload", "/html/popup/pop-buid-upload.html", {
            title: "건축물관리대장DB UPLOAD"
        }) ; 
    } ;

    var fn_doExecute = () => {
        var jobid = $("#p_jobid").val() ; 
        network.send("/api/v1/batch/" + jobid, {}, {
            "jobid": jobid
        }).then(response => {
            debugger ; 
        }).catch(e => {
            message.alert(e.getMessage) ;
        })
    }

    /* 페이지 이번트 */
    var fn_page_onLoad = () => {
        fn_isLogin() ; /* 로그인여부판단 ( 토큰이 없으면 로그인페이지로 튕김 ) */ 
        fn_homes_admin_init() ; /* GNB, LNB 초기화 */ 
        homes_grid.init_grid({
            gid: "grid_userList" /* grid id */
            , rid: "grid_result" /* grid result-set id */ 
            , paging: {
                id: "grid_paging"
                , useYn: true
            }
        }) ;
        $("#btn_search").click(function() {
            fn_userList() ; 
        }) ;

        $("#btn_upload").click(function() {
            fn_open_uploadPop() ; 
        }) ;

        $("#btn_doExecute").click(function() {
            fn_doExecute() ; 
        }) ; 
    }

  </script>
