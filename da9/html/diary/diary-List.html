<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="16x16"  href="/images/favicon-square.ico">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="theme-color" content="#712cf9">
        <title>다구형 끄적끄적</title>

        <!-- bootstrap css -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <!-- bootstrap icon-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="/css/sidebars/sidebars.css" rel="stylesheet">
        <link href="/css/common.css" rel="stylesheet">
        <link href="/css/da9-style.css" rel="stylesheet">

        <script src="/js/assets/js/color-modes.js"></script>
    </head>
    <body class="body-class">
        <header id="d_header"></header>
        <main class="flex-shrink-0">
            <div id="sub_title" class="container main-title bg-white border-bottom">
                <div class="title-left">
                    <h5 class="my-0">나의 일기보기</h5>
                </div>
                <div class="title-action me-2">
                    <div class="input-group">
                        <button type="button" class="btn-icon" id="btn_write"><img src="/images/pencil-square.svg" width="30" height="30"/></button>
                        <button type="button" class="btn-icon" id="btn_view_List"><img src="/images/list-task-primary.svg" width="30" height="30"/></button>
                        <button type="button" class="btn-icon" id="btn_view_calendar"><img src="/images/grid-3x3-gap-fill.svg" width="30" height="30"/>
                        <!--
                        <input type="text" class="form-control w-150px ml-5px border-left-radius" id="keyword" placeholder="제목/본문검색" required=""/>
                        <span class="input-group-text bi bi-search border-right-radius"></span><div class="invalid-feedback">
                        -->
                    </div>
                </div>
            </div>
            
            <div class="container body">
                <div id="diaryList" class="my-3 p-3 bg-body rounded shadow-sm">
                    <div class="border-bottom pb-2 mb-0 input-group">
                        <select class="form-select w=100" id="p_interval">
                            <option value="07D">최근 1주</option>
                            <option value="14D">최근 2주</option>
                            <option value="01M" selected>최근 1달</option>
                            <option value="06M">최근 6달</option>
                            <option value="01Y">최근 1년</option>
                        </select>
                    </div>
                    <div id="no_diary" class='d-flex text-body-secondary pt-3 hidden'>                    
                        <div class="list-cont">
                            <h3 class="cont-title bold text-dark">작성된 일기가 없습니다.</h3>
                            <div class="cont-body text-dark">
                                <p>작성된 일기가 없습니다.</p>
                                <p>새로운 나의 일기를 작성해 보아요</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        
        <script src="/js/common/da9-comm.js"></script>
        <script src="/js/diary/diary-List.js"></script>
    </body>
</html>
