<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="16x16"  href="/images/favicon-square.ico">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="theme-color" content="#712cf9">
        <title>다구형 끄적끄적</title>

        <!--jQuery UI plugins -->
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

        <!-- bootstrap css -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <!-- bootstrap icon-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="/css/sidebars/sidebars.css" rel="stylesheet">
        <link href="/css/common.css" rel="stylesheet">
        <link href="/css/da9-style.css" rel="stylesheet">

        <script src="/js/assets/js/color-modes.js"></script>
    </head>
    <body>
        <main class="main">
            <header class="top-header" id="top-header" class="p-3 mb-3"></header>
        </main>
        <main class="main" id="sub_title">
            <div class="top-cont">
                <div class="div-cont">
                    <div class="container main-title">
                        <div class="title-left">
                            <h5 class="my-0">나의 일기쓰기</h5>
                        </div>
                        <div class="title-action me-2">
                            <button type="button" class="btn btn-primary mx-1" id="btn_save">작성하기</button>
                            <button type="button" class="btn btn-outline-secondary" id="btn_List">목록으로</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <main>
            <div class="top-cont-body">
                <div class="div-cont-body">
                    <div class="container grid-table first">
                        <div class="grid-cell label">
                            <span class="required">작성일자</span>
                        </div>
                        <div class="grid-cell input-group unset-width has-validation">
                            <input type="text" class="form-control w-150px" placeholder="yyyy.mm.dd" id="p_diary_de" required/>
                            <span class="input-group-text cur-hand" id="btn_diary_de">
                                <i class="bi bi-calendar-week"></i>
                            </span>
                            <div class="invalid-feedback">일기작성 일자를 입력해 주세요</div>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>공휴일 등록</span>
                        </div>
                        <div class="grid-cell input-group unset-width has-validation">
                            <input type="text" class="form-control w-150px" placeholder="공휴일명 입력" id="p_holiday"/>
                            <span class="badge red mx-2">현충일</span>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>기념일 등록</span>
                        </div>
                        <div class="grid-cell input-group unset-width has-validation">
                            <input type="text" class="form-control w-150px" placeholder="기념일 입력" id="p_anniversary"/>
                            <span class="badge info mx-2">대선이 생일</span>
                            <span class="badge info mx-2">우리모임(1회차)</span>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>Tag 등록</span>
                        </div>
                        <div class="grid-cell input-group unset-width has-validation">
                            <input type="text" class="form-control w-150px" placeholder="Tag 입력" id="p_tag"/>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>오늘 날씨</span>
                        </div>
                        <div class="grid-cell">
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-sun-fill text-orange"></i></button>
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-cloud-sun-fill text-secondary"></i></button>
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-cloudy-fill text-secondary"></i></button>
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-clouds-fill text-secondary"></i></button>
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-cloud-rain-fill text-secondary"></i></button>
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-cloud-rain-heavy-fill text-secondary"></i></button>
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-cloud-sleet-fill text-secondary"></i></button>
                            <button class="btn btn-outline-info rounded-circle p-2 lh-1" type="button"><i class="bi bi-cloud-snow-fill text-secondary"></i></button>
                        </div>
                    </div>
                    <div class="container grid-table last">
                        <div class="grid-cell label">
                            <span>오늘 기분</span>
                        </div>
                        <div class="grid-cell">
                            <div class="d-flex flex-nowrap">
                                <div class="fs-2 mx-1 bi bi-emoji-heart-eyes text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-grin text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-kiss text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-laughing text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-smile text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-sunglasses text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-neutral text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-surprise text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-expressionless text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-tear text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-frown text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-astonished text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-dizzy text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-angry text-secondary"></div>
                                <div class="fs-2 mx-1 bi bi-emoji-grinace text-secondary"></div>
                            </div>
                        </div>
                    </div>
                    <div class="container grid-table first">
                        <div class="grid-cell label">
                            <span>일기 제목</span>
                        </div>
                        <div class="grid-cell field input-group unset-width has-validation">
                            <input type="text" class="form-control" placeholder="제목을 입력하세요" id="p_diary_title" required/>
                            <div class="invalid-feedback">일기제목을 입력해 주세요</div>
                        </div>
                    </div>
                    <div class="container grid-table last">
                        <div class="grid-cell label">
                            <span class="required">일기 내용</span>
                        </div>
                        <div class="grid-cell field input-group unset-width has-validation">
                            <textarea rows="20" class="form-control" id="p_diary_cont"></textarea>
                            <div class="invalid-feedback">일기내용을 입력해 주세요</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
        
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>

        <script src="/js/common/da9-comm.js"></script>

        <script type="text/javascript">
            $(document).ready(function() {
                fn_set_Layout("Diary") ;
      
                /* 로드 후 페이지 event */
                $("#btn_List").click(function() {
                    location.href="/html/diary/diary-List.html"
                }) ; 
                da9.ui.datepicker( "p_diary_de", "btn_diary_de" ) ; 

                /* scroll moving event */
                $(".top-cont-body").scroll(function() {
                    /* 현재 스크롤 위치 얻기 */
                    let sc_pos = $(this).scrollTop() ;
                    if (sc_pos > 0) {
//                        $("#sub_title").removeClass("shadow").addClass("shadow") ; 
                    } else {
//                        $("#sub_title").removeClass("shadow") ; 
                    }
                }) ; 
            }) ; 
        </script>
    </body>
</html>
