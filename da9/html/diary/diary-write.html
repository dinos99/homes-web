<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="16x16"  href="/images/favicon-square.ico">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="theme-color" content="#712cf9">
        <title>다구형 끄적끄적</title>

        <!--jQuery UI plugins -->
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

        <!-- bootstrap css -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <!-- bootstrap icon-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="/css/sidebars/sidebars.css" rel="stylesheet">
        <link href="/css/common.css" rel="stylesheet">
        <link href="/css/da9-style.css" rel="stylesheet">

        <script src="/js/assets/js/color-modes.js"></script>

        <!-- Include Quill stylesheet -->
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
        <link href="/css/quill/quill-custom.css" rel="stylesheet" />
    </head>
    <body>
        <main class="main">
            <header class="top-header" id="top-header" class="p-3 mb-3"></header>
        </main>
        <main class="main" id="sub_title">
            <div class="top-cont">
                <div class="div-cont">
                    <div class="container main-title">
                        <div class="title-left">
                            <h5 class="my-0">나의 일기쓰기</h5>
                        </div>
                        <div class="title-action me-2">
                            <button type="button" class="btn btn-primary mx-1" id="btn_save">작성하기</button>
                            <button type="button" class="btn btn-success mx-1" id="btn_temp_save">임시저장</button>
                            <button type="button" class="btn btn-outline-secondary" id="btn_List">목록으로</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <main>
            <div class="top-cont-body">
                <div class="div-cont-body">
                    <div class="container grid-table first">
                        <div class="grid-cell label">
                            <span class="required">작성일자</span>
                        </div>
                        <div class="grid-cell input-group unset-width has-validation">
                            <input type="text" class="form-control border-right-radius-0 w-150px" placeholder="yyyy.mm.dd" id="p_diary_de" readonly required/>
                            <span class="input-group-text cur-hand" id="btn_diary_de">
                                <i class="bi bi-calendar-week"></i>
                            </span>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>공휴일 등록</span>
                        </div>
                        <div class="grid-cell input-group unset-width" id="badge_holiday">
                            <input type="text" class="form-control w-150px" placeholder="공휴일명 입력" id="p_holiday"/>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>기념일 등록</span>
                        </div>
                        <div class="grid-cell input-group unset-width" id="badge_anniversary">
                            <input type="text" class="form-control w-150px" placeholder="기념일 입력" id="p_anniversary"/>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>Tag 등록</span>
                        </div>
                        <div class="grid-cell input-group unset-width" id="input_tag">
                            <input type="text" class="form-control w-150px" placeholder="Tag 입력" id="p_tag"/>
                        </div>
                    </div>
                    <div class="container grid-table">
                        <div class="grid-cell label">
                            <span>오늘 날씨</span>
                        </div>
                        <div class="grid-cell">
                            <div id="sel_weather" class="dropdown rounded">
                                <a href="#" class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle">
                                    <div class="cur-hand mx-1 p-2 bi bi-sun-fill text-orange">
                                        <span class="text-body mx-2">햇볕은 쨍쨍</span>
                                    </div>                
                                </a>
                            </div>
                            <ul id="option_weather" class="dropdown-menu static text-small">
                                <li class="px-1">
                                    <div id="btn_weather_00_01" class="dropdown-item rounded-2 py-2 bi bi-sun-fill">
                                        <a href="#" class="mx-2 text-decoration-none">햇볕은 쨍쨍</a> 
                                    </div>
                                </li>
                                <li class="px-1">
                                    <div id="btn_weather_00_02" class="dropdown-item rounded-2 py-2 bi bi-cloud-sun-fill">
                                        <a href="#" class="mx-2 text-decoration-none">구름 조금</a>
                                    </div>
                                </li>
                                <li class="px-1">
                                    <div id="btn_weather_00_03" class="dropdown-item rounded-2 py-2 bi bi-cloudy-fill">
                                        <a href="#" class="mx-2 text-decoration-none">흐림</a>
                                    </div>
                                </li>
                                <li class="px-1">
                                    <div id="btn_weather_00_04" class="dropdown-item rounded-2 py-2 bi bi-clouds-fill">
                                        <a href="#" class="mx-2 text-decoration-none">곧 비올듯</a>
                                    </div>
                                </li>
                                <li class="px-1">
                                    <div id="btn_weather_00_05" class="dropdown-item rounded-2 py-2 bi bi-cloud-rain-fill">
                                        <a href="#" class="mx-2 text-decoration-none">어라? 비가 내리네?</a>
                                    </div>
                                </li>
                                <li class="px-1">
                                    <div id="btn_weather_00_06" class="dropdown-item rounded-2 py-2 bi bi-cloud-rain-heavy-fill">
                                        <a href="#" class="mx-2 text-decoration-none">비가 퍼붓는데?</a>
                                    </div>
                                </li>
                                <li class="px-1">
                                    <div id="btn_weather_00_07" class="dropdown-item rounded-2 py-2 bi bi-cloud-sleet-fill">
                                        <a href="#" class="mx-2 text-decoration-none">비도오고 눈도오고</a>
                                    </div>
                                </li>
                                <li class="px-1">
                                    <div id="btn_weather_00_08" class="dropdown-item rounded-2 py-2 bi bi-cloud-snow-fill">
                                        <a href="#" class="mx-2 text-decoration-none">눈이내린다!</a>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="container grid-table last">
                        <div class="grid-cell label">
                            <span>오늘 기분</span>
                        </div>
                        <div class="grid-cell">
                            <div class="d-flex flex-nowrap feeling_set">
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-heart-eyes-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-grin-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-kiss-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-laughing-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-smile-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-sunglasses-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-neutral-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-surprise-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-expressionless-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-tear-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-frown-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-astonished-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-dizzy-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-angry-fill text-secondary"></div>
                                <div class="cur-hand fs-2 mx-1 bi bi-emoji-grinace-fill text-secondary"></div>
                            </div>
                        </div>
                    </div>
                    <div class="container grid-table first">
                        <div class="grid-cell label">
                            <span>일기 제목</span>
                        </div>
                        <div class="grid-cell field input-group unset-width has-validation">
                            <input type="text" class="form-control" placeholder="제목을 입력하세요" id="p_diary_title" required/>
                            <div class="invalid-feedback">일기제목을 입력해 주세요</div>
                        </div>
                    </div>
                    <div class="container grid-table last">
                        <div class="grid-cell label">
                            <span class="required">일기 내용</span>
                        </div>
                        <div class="grid-cell field">
                            <div class="textarea-style" id="p_diary_cont">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
        
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>

        <!-- Include the Quill library -->
        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

        <script src="/js/common/da9-comm.js"></script>
        <script src="/js/common/quill-custom.js"></script>
        <script src="/js/diary/diary-write.js"></script>


    </body>
</html>
