<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="16x16"  href="/images/favicon-square.ico">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="theme-color" content="#712cf9">
        <title>다구형 끄적끄적</title>

        <!-- bootstrap css -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <!-- bootstrap icon-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="/css/sidebars/sidebars.css" rel="stylesheet">
        <link href="/css/common.css" rel="stylesheet">
        <link href="/css/da9-style.css" rel="stylesheet">

        <script src="/js/assets/js/color-modes.js"></script>

        <!-- Include Quill stylesheet -->
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
        <link href="/css/quill/quill-custom.css" rel="stylesheet" />
    </head>
    <body class="body-class">
        <header id="d_header"></header>
        <main class="flex-shrink-0">
            <div id="sub_title" class="container main-title bg-white border-bottom">
                <div class="title-left">
                    <h5 class="my-0">나의 일기보기</h5>
                </div>
            </div>
            <div class="container body">
                <div id="diaryList" class="my-3 p-3 bg-body rounded shadow-sm">
                    <div class="d-flex text-body-secondary pt-3">
                        <div class="pb-3 small lh-sm w-100">
                            <div class="diary-list between">
                                <h3 class="text-gray-dark" id="text_diryde"></h3>
                                <div id="icon_set">
                                    <a href="#" class="text-decoration-none mx-1"><i id="diry_wthr" class="bi"></i></a>
                                    <a href="#" class="text-decoration-none mx-1"><i id="diry_felling" class="bi text-yellow"></i></a>
                                    <a href="#" class="text-decoration-none mx-1 hidden" id="diry_image">
                                        <i class="bi bi-file-image text-primary no-margin-r"></i>
                                    </a>
                                    <a href="#" class="text-decoration-none"><span class="text-dark no-margin-l" id="diry_image_cnt"></span></a>
                                    <a href="#" class="text-decoration-none mx-1"><i class="bi bi-chat-text text-dark no-margin-r"></i></a>
                                    <a href="#" class="text-decoration-none"><span class="text-dark no-margin-l">0</span></a>
                                </div>
                            </div>
                            <div class="diary-list between" id="text_diryTitle"></div>
                            <div class="diary-list start" id="diry_badge">
                            </div>
                            <div class="diary-list start" id="diry_Tag">
                            </div>
                            <div class="diary-cont border rounded">
                                <div class="textarea-style ql-container ql-snow view">
                                    <div class="ql-editor" id="diary_html">

                                    </div>
                                </div>
                                <div class="textarea-style hidden" id="p_diary_cont">

                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="btn-action me-2">
                        <button type="button" class="btn btn-outline-secondary" id="btn_List">목록으로</button>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        
        <!-- Include the Quill library -->
        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

        <script src="/js/common/da9-comm.js"></script>
        <script src="/js/common/quill-custom.js"></script>
        <script src="/js/diary/diary-view.js"></script>
    </body>
</html>
