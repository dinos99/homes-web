<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="16x16"  href="/images/favicon-square.ico">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="theme-color" content="#712cf9">
        <title>다구형 끄적끄적</title>

        <!--jQuery UI plugins -->
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

        <!-- bootstrap css -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <!-- bootstrap icon-->
        <script src="/js/assets/js/color-modes.js"></script>

        <!-- bootstrap sign-in.css -->
        <link href="/css/sign-in/sign-in.css" rel="stylesheet">

        <link href="/css/common.css" rel="stylesheet">
        <link href="/css/da9-style.css" rel="stylesheet">
    </head>
    <body class="body-center py-4">
        <main class="form-signin w-100 m-auto">
            <form>
                <h1 class="h3 mb-3">Required Log-in</h1>
                <div class="form-floating">
                    <input type="text" class="form-control" id="p_Loginid" placeholder="로그인ID를 입력해주세요" value="da9">
                    <label for="p_Loginid">ID를 입력해 주세요.</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="p_password" autoComplete="off" placeholder="******"value="da9#!2">
                    <label for="p_password">비밀번호 입력</label>
                </div>
                <div class="form-check text-start my-3">
                    <input class="form-check-input" type="checkbox" value="Y" id="p_remember_me">
                    <label class="form-check-label" for="p_remember_me">
                        자동로그인
                    </label>
                </div>
                <button type="button" id="btn_Login" class="btn btn-primary w-100 py-2 mb-2" data-toggle="modal" data-target="#exampleModalCenter">Log-in</button>
                <button type="button" id="btn_Regist" class="btn btn-secondary w-100 py-2">회원가입</button>
            </form>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="/js/common/da9-comm.js"></script>

        
        <script type="text/javascript">

            var fn_doValidate = () => {
                var is_Loginid = da9comm.validator.is_Empty("#p_Loginid") ;
                var is_password = da9comm.validator.is_Empty("#p_password") ;
                if ( !is_Loginid ) {
                    da9comm.alert({
                        title: "입력오류",
                        message: da9message.fn_get_message(da9message.validator.REQUIRED_INPUT, "로그인 ID는")
                    }).then(ok => {
                        $("#p_Loginid").focus() ;
                    }) ;
                    return false ;

                }
                if ( !is_password ) {
                    da9comm.alert({
                        title: "입력오류",
                        message: da9message.fn_get_message(da9message.validator.REQUIRED_INPUT, "비밀번호는")
                    }).then(ok => {
                        $("#p_password").focus() ;
                    }) ;
                    return false ;
                }
                return is_Loginid && is_password ;
            }

            var fn_Login = () => {
                var doValid = fn_doValidate() ;
                var is_checked = $("#p_remember_me").eq(0).is(":checked") ? "Y" : "N" ; 
                store.setItem("rememberMe", is_checked) ;
                if ( doValid ) {
                    var p_remember_me = is_checked ;
                    var p_Loginid     = $("#p_Loginid").val() ;
                    var p_password    = btoa($("#p_password").val()) ;
                }

                network.send("/api/v1/auth/sign-in", {
                    is_auth: false
                }, {
                    userid     : p_Loginid,
                    password   : p_password,
                    rememberMe : p_remember_me
                }).then(response => {
                    store.init_token(response.token, response.data) ;
                    location.href = da9const._LOGIN_AFTER_PATH_ ;
                }) ;
            }

            $(document).ready(function() {
                fn_init_page("Login", {
                    is_auth: false
                }) ;

                $("#btn_Login").click(function() {
                    fn_Login() ;
                }) ;
            }) ;
        </script>
    </body>
</html>
