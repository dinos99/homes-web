<div class="dimmed"></div>
<div class="homes-modal">
  <div class="modal-sheet" tabindex="-1" role="dialog" id="popHomesLogin">
    <div class="modal-dialog w-500px">
      <div class="modal-content rounded-4 border bg-body shadow">
        <div class="modal-header px-2 py-4 pb-2 border-bottom-0">
          <h4 class="w-100 tac" id="text_usernm"></h4>
        </div>
        <div class="list-group-wrap p-2 gap-4 py-0 ">
            <div class="list-group w-100">
                <label class="list-group-item p-3 gap-2">
                    <p>휴대전화 본인확인을 위해서는 [휴대전화 본인확인]이 필요합니다.</p>
                    <p>아래의 [휴대전화 본인확인]을 진행해 주십시오.</p>
                </label>
            </div>
        </div>
        <div class="modal-border-bottom p-2"></div>
        <div class="modal-footer w-100 p-2 gap-2 pb-3 border-top-0">
            <button type="button" class="btn btn-lg btn-danger w-100" id="btn_mbcertifation">휴대전화 본인확인</button>
        </div>
    </div>
  </div>
</div>

<script>
    $(document).ready(function() {
        var member = homes_comm.store.getItem("member") ; 
        $("#text_usernm").text(member.usernm + "님 홈즈프로 방문을 환영합니다.") ; 
        $("#btn_mbcertifation").click(function() {
            var mcont = $("<div id='pop_mbcertification' class='popup-container'/>") ; 
            $("body").append(mcont) ; 
            mcont.load("/html/popup/popMobileCert.html", () => {       
                $("#pop_member").remove() ;
            }) ;
        }) ;     
    }) ;

</script>
