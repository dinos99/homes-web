<div class="dimmed"></div>
<div class="homes-modal">
  <div class="modal-sheet" tabindex="-1" role="dialog" id="pop-subscribe-01">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 border bg-body shadow">
        <div class="modal-header px-2 py-4 border-bottom-0">
          <h3 class="w-100 tac">약관동의</h3>
        </div>
  
        <div class="list-group-wrap p-2 gap-4 py-0 ">
            <div class="list-group">
              <label class="list-group-item d-flex gap-2 cursor-hand py-3" for="agreement_all">
                <input class="form-check-input flex-shrink-0" type="checkbox" value="Y" id="agreement_all">
                <span>전체동의 
                  <!-- <small class="d-block text-body-secondary">With support text underneath to add more detail</small> -->
                </span>
              </label>
              <label class="list-group-item d-flex gap-2 cursor-hand py-2" for="agree_01">
                <input class="form-check-input flex-shrink-0" type="checkbox" value="Y" id="agree_01">
                <span>[필수]만 14세 이상입니다.</span>
              </label>
              <label class="list-group-item d-flex gap-2 cursor-hand py-2" for="agree_02">
                <input class="form-check-input flex-shrink-0" type="checkbox" value="Y" id="agree_02">
                <span>[필수]<a href="#">홈즈프로 서비스 이용약관</a> 동의 </span>
              </label>
              <label class="list-group-item d-flex gap-2 cursor-hand py-2" for="agree_03">
                <input class="form-check-input flex-shrink-0" type="checkbox" value="Y" id="agree_03">
                <span>[필수]<a href="#">개인정보 수집 및 이용</a>에 대한 동의 </span>
              </label>
              <label class="list-group-item d-flex gap-2 cursor-hand py-2" for="agree_04">
                <input class="form-check-input flex-shrink-0" type="checkbox" value="Y" id="agree_04">
                <span>[선택]<a href="#">이벤트 동의 정보수신</a>에 대한 동의 </span>
              </label>
            </div>
        </div>
        <div class="modal-border-bottom p-2"></div>
        <div class="modal-footer w-100 p-2 gap-2 pb-3 border-top-0">
            <button type="button" class="btn btn-secondary w-30" id="btn_subcribe_01_cancel">취소</button>
            <button type="button" class="btn btn-secondary w-70" id="btn_subcribe_01_next" disabled="disabled">다음</button>
        </div>
    </div>
  </div>
</div>

<script type="text/javascript">
    var fn_check_agree = () => {
        var agrees = [] ;
        $("input[id^=agree_]").each(function(i, e) {
            agrees.push($(this).is(":checked")) ; 
        }) ; 
        if ( agrees[0] && agrees[1] && agrees[2] ) {
            $("#btn_subcribe_01_next")
                .removeClass("btn-secondary")
                .removeClass("btn-danger")
                .addClass("btn-danger")
                .removeAttr("disabled") ; 
            /* 전체동의 checked */ 
            $("#agreement_all").removeAttr("checked").attr("checked", "checked") ; 
        } else {
            $("#btn_subcribe_01_next")
                .removeClass("btn-secondary")
                .removeClass("btn-danger")
                .addClass("btn-secondary")
                .attr("disabled", "disabled") ; 
            /* 전체동의 unchecked */ 
            $("#agreement_all").removeAttr("checked") ; 
        }
    }

    $("#agreement_all").click(function() {
        var b_checked = $(this).is(":checked") ; 
        if ( b_checked ) {
            $("input[id^=agree_]").each(function(i) {
                var checked = $(this).is(":checked") ; 
                if ( !checked ) $(this).click() ; 
            }) ;
        } else {
            $("input[id^=agree_]").each(function(i) {
                var checked = $(this).is(":checked") ; 
                if ( checked ) $(this).click() ; 
            }) ;
        }
        fn_check_agree() ;
    }) ;
    $("input[id^=agree_]").click(function() {
        $("input[id^=agree_]").each(function(i) {
            var checked = $(this).is(":checked") ; 
        }) ;
        fn_check_agree() ;
    }) ; 

    /* 취소버튼 클릭 */ 
    $("#btn_subcribe_01_cancel").click(function() {
        $("#pop_subscribe_01").remove() ;
    }) ; 


    $("#btn_subcribe_01_next").click(function() {
        var agree = {} ; 
        $("input[id^=agree_]").each(function(i, e) {
            agree["agree_0" + Number(i + 1) + "_yn"] = $(this).is(":checked") ? "Y" : "N" ; 
        }) ; 

        _gv["subs_01"] = {}; 
        _gv.subs_01.agrees = agree ; 

        var mcont = $("<div id='pop-subscribe-02' class='popup-container'/>") ; 
        $("body").append(mcont) ; 
        
        mcont.load("/html/popup/member/pop-subscribe-02.html", () => {            
            $("#pop-subscribe-01").remove() ;
        }) ;
    }) ; 

</script>
