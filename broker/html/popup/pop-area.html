<div class="pop-main bg-transparent">
    <div class="pop-cont rounded-4 shadow bg-white">
        <div class="pop-cont-body p-4">
            <div class="pop-cont px-2">
                <div class="pop-cont-box w-800px border-bottom">
                    <div class="arear-text-btns mb-10">
                        <button type="button" class="btn-white bold hidden" id="btn_sido_label"></button>
                        <div class="arrow hidden"></div>
                        <button type="button" class="btn-white bold hidden" id="btn_sgg_label"></button>
                    </div>
                </div>
                <div class="pop-cont-box align-start my-2 w-800px h-250px">
                    <div class="btn-group" id="btn_emd_groups"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    var p_arcode = {
        arcode : "",
        sdcode : {arcode: "", arname: ""},
        sggcode: {arcode: "", arname: ""},
        emdcode: {arcode: "", arname: ""},
        sdList : [],
        sggList: []
    }

    var fn_show_button = (sdsgg, arname) => {
        $("#btn_" + sdsgg + "_label").text(arname) ; 
        $("#btn_" + sdsgg + "_label").removeClass("hidden") ; 
        $(".arear-text-btns > .arrow").removeClass("hidden") ; 
    }

    var fn_hide_sggLabel = () => {
        $("#btn_sgg_label").text("") ; 
        $("#btn_sgg_label").removeClass("hidden").addClass("hidden") ; 
        $(".arear-text-btns > .arrow").removeClass("hidden").addClass("hidden") ; 
        $("#btn_emd_groups").empty() ;
    }

    var fn_get_sidocode = () => {
        homes_comm.network.send("/common/arcode/sidoList", {
            "arcode":  p_arcode.arcode
        }, (response) => {
            fn_set_sidocode(response.data) ; 
        }) ; 
    }

    var fn_get_sggcode = () => {
        homes_comm.network.send("/common/arcode/sggList", {
            "arcode":  p_arcode.arcode
        }, (response) => {
            fn_set_sggcode(response.data) ; 
        }) ; 
    }

    var fn_set_sidoList = () => {
        fn_hide_sggLabel() ;
        if ( p_arcode.sdList.length > 0) {
            p_arcode.sdList.forEach(arcode => {
                var btn_group = $("#btn_emd_groups") ; 
                var ar_button = $("<button type='button' class='btn-white' id='btn_arcode_" + arcode.arcode + "'>" + arcode.arname + "</button>") ; 
                btn_group.append(ar_button) ; 
                if ( arcode.arcode == p_arcode.sdcode.arcode ) {
                    ar_button.addClass("selected") ;
                }
                ar_button.click(function() {
                    p_arcode.sdcode.arcode = $("#btn_arcode_" + arcode.arcode).attr("id").split("_").splice(2, 1).toString() ;
                    p_arcode.sdcode.arname = $(this).text() ; 
                    p_arcode.arcode = p_arcode.sdcode.arcode ;
                    fn_show_button("sido", arcode.arname) ; 
                    fn_hide_sggLabel() ; 
                    fn_get_sggList() ; 
                }) ; 
            }) ; 
        }
    }

    var fn_get_sggList = () => {
        homes_comm.network.send("/common/arcode/sggList", {
            "arcode":  p_arcode.arcode
        }, (response) => {
            fn_set_sggList(response.data) ; 
        }) ; 
    }


    var fn_get_emdcode = () => {
        homes_comm.network.send("/common/arcode/emdList", {
            "arcode":  p_arcode.arcode
        }, (response) => {
            fn_set_emdList(response.data) ; 
        }) ; 
    }

    var fn_set_sidocode = (sidoList) => {
        p_arcode.sdList = [] ; 
        fn_hide_sggLabel() ;
        sidoList.forEach(arcode => {
            if ( arcode.selected == "selected") {
                fn_show_button("sido", arcode.arname) ; 
                p_arcode.sdcode.arcode = arcode.arcode.substring(0, 2) + "000" ; 
                p_arcode.sdcode.arname = arcode.arname ; 
            }
            p_arcode.sdList.push({
                "arcode": arcode.arcode.substring(0, 2) + "000" ,
                "arname": arcode.arname
            }) ; 
        }) ; 
        fn_get_sggcode() ;
    }

    var fn_set_sggcode = (sggList) => {
        p_arcode.sggList = [] ; 
        fn_hide_sggLabel() ;
        sggList.forEach(arcode => {
            if ( arcode.selected == "selected") {
                fn_show_button("sgg", arcode.arname) ; 
                p_arcode.arcode  = arcode.arcode.substring(0, 5) ; 
                p_arcode.sggcode.arcode = arcode.arcode.substring(0, 5) ; 
                p_arcode.sggcode.arname = arcode.arname ; 
            }
            p_arcode.sggList.push({
                "arcode": arcode.arcode.substring(0, 5) ,
                "arname": arcode.arname
            }) ; 
        }) ; 
        fn_get_emdcode() ; 
    }

    var fn_set_sggList = (sggList) => {
        p_arcode.sggList = [] ; 
        fn_hide_sggLabel() ;
        sggList.forEach(arcode => {
            if ( arcode.selected == "selected") {
                fn_show_button("sgg", arcode.arname) ; 
                p_arcode.arcode  = arcode.arcode.substring(0, 5) ; 
                p_arcode.sggcode.arcode = arcode.arcode.substring(0, 5) ; 
                p_arcode.sggcode.arname = arcode.arname ; 
            }
            p_arcode.sggList.push({
                "arcode": arcode.arcode.substring(0, 5) ,
                "arname": arcode.arname
            }) ; 
        }) ;
        if ( p_arcode.sggList.length > 0) {
            p_arcode.sggList.forEach(arcode => {
                var btn_group = $("#btn_emd_groups") ; 
                var ar_button = $("<button type='button' class='btn-white' id='btn_arcode_" + arcode.arcode + "'>" + arcode.arname + "</button>") ; 
                btn_group.append(ar_button) ; 
                if ( arcode.arcode == p_arcode.sggcode.arcode ) {
                    ar_button.addClass("selected") ;
                    p_arcode.sggcode.arcode = $("#btn_arcode_" + arcode.arcode).attr("id").split("_").splice(2, 1).toString() ;
                    p_arcode.sggcode.arname = arcode.arname
                    p_arcode.arcode  = p_arcode.sggcode.arcode ;
                }
                ar_button.click(function() {
                    fn_show_button("sgg", arcode.arname) ; 
                    p_arcode.sggcode.arcode = $("#btn_arcode_" + arcode.arcode).attr("id").split("_").splice(2, 1).toString() ;
                    p_arcode.sggcode.arname = $(this).text() ; 
                    p_arcode.arcode  = p_arcode.sggcode.arcode ;
                    fn_get_emdcode() ; 
                }) ; 
            }) ; 
        }

    }

    fn_set_emdList = ( emdList ) => {
        console.log("p_arcode.arcode: ", p_arcode.arcode) ; 
        $("#btn_emd_groups").empty() ;
        emdList.forEach(arcode => {
            var btn_group = $("#btn_emd_groups") ; 
            var ar_button = $("<button type='button' class='btn-white' id='btn_emdcode_" + arcode.emdcd + "'>" + arcode.arname + "</button>") ; 
            btn_group.append(ar_button) ; 
            if ( arcode.selected == "selected" ) {
                ar_button.addClass("selected") ;
                p_arcode.emdcode.arcode = arcode.emdcd ; 
                p_arcode.emdcode.arname = arcode.arname ;
            }
            ar_button.click(function() {
                p_arcode.emdcode.arcode = $(this).attr("id").split("_").splice(2, 1).toString() ;
                p_arcode.emdcode.arname = arcode.arname ;
                fn_pop_close_data({
                    arcode : p_arcode.arcode,
                    sdcode : p_arcode.sdcode,
                    sggcode: p_arcode.sggcode,
                    emdcode: p_arcode.emdcode
                }) ; 
                fn_pop_close() ;
            }) ; 
        }) ; 
    }

    var fn_pop_close_data = ( arcode ) => {} ; 
    var fn_pop_close = () => {
        $("#popup-area").remove() ;
        $(".dimmed").remove() ;
    }
    var fn_open_completed = ( pop_params, fn_callback ) => {
        fn_pop_close_data = fn_callback ; 
        p_arcode.arcode = pop_params.arcd ; 
        fn_get_sidocode() ; 

        $("#btn_sido_label").click(function() {            
            fn_set_sidoList() ; 
        }) ; 
        
        $("#btn_sgg_label").click(function() { 
            fn_get_sggList() ; 
        }) ; 

    } ; 
</script>
