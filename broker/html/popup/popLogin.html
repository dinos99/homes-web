
<div class="dimmed"></div>
<div class="homes-modal">
  <div class="modal-sheet" tabindex="-1" role="dialog" id="popHomesLogin">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 border bg-body shadow">
        <div class="modal-header px-2 py-4 border-bottom-0">
          <div class="homes-login-title pro fw-bold mb-0 fs-2">홈즈프로-로그인</div>
          <button type="button" id="btn_pop_close" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
  
        <div class="modal-body px-2 pt-0 ">
          <form class="">
            <div class="form-floating mb-3">
              <input type="email" class="form-control rounded-3" id="p_email" placeholder="name@example.com" value="broker03@homes.co.kr">
              <label for="p_email">이메일주소 입력</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control rounded-3" id="p_password" placeholder="Password" value="homes1234">
              <label for="p_password">비밀번호입력</label>
            </div>
            <button class="w-100 mb-2 btn btn-lg rounded-3 btn-secondary" type="button" id="btn_homes_Login">Sign up</button>
            <!-- <small class="text-body-secondary">By clicking Sign up, you agree to the terms of use.</small> -->
            <hr class="my-4">
            <!-- <h2 class="fs-5 fw-bold mb-3">Or use a third-party</h2> -->
            <button class="w-100 py-2 mb-2 btn btn-outline-secondary rounded-3" type="button" id="btn_agreement">
              이메일로 회원가입
            </button>
            <button class="w-100 py-2 mb-2 btn btn-outline-secondary rounded-3" type="button">
              아이디/비밀번호 찾기
            </button>
            <img src="/images/kakao_login_medium_wide.png" id="btn_kakaoLogin" class="btn-kakao-login"/>
          </form>
        </div>
      </div>
    </div>
  </div>
  <iframe src="" width="0" height="0" name="hddn_ifrm" id="hddn_ifrm" class="hddn_ifrm"></iframe>
  <script type="text/javascript">
    $(document).ready(function() {
      $("#btn_homes_Login").click(function() {

        network.send_api("/auth/homesLogin", {
          is_auth: false 
        }, {
          email   : $("#p_email").val(),
          password: btoa($("#p_password").val())
        }).then(response => {
          homes.store.init_token(response.token, response.data) ; 
          var user = homes.store.getItem("user") ; 
          message.alert(user.usernm + "님 로그인되었습니다.")
          .then(data => {
            /* 창닫기 시전 */
            $("#btn_pop_close").click() ; 
          }) ; 
        }).catch(e => {
          message.alert(e.errorMessage) ;
        }) ;


      }) ;
    }) ;

</script>
  
</div>
