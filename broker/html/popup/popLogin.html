
<div class="dimmed"></div>
<div class="homes-modal">

        <div class="modal-header px-2 py-4 border-bottom-0">
          <div class="homes-login-title pro fw-bold mb-0 fs-2">홈즈프로-로그인</div>
          <button type="button" id="btn_pop_close" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
  
        <div class="modal-body px-2 pt-0 ">
          <form class="">

            <!-- <h2 class="fs-5 fw-bold mb-3">Or use a third-party</h2> -->

            </button>
            <button class="w-100 py-2 mb-2 btn btn-outline-secondary rounded-3" type="button">
              아이디/비밀번호 찾기
            </button>
            <img src="/images/kakao_login_medium_wide.png" id="btn_kakaoLogin" class="btn-kakao-login"/>
