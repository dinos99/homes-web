    <script type="text/javascript">

        $(document).ready(function() {
            build.info = parent.fn_get_param() ;             
            $(".slide-abs-arrow").click(function() {
                var has = $("#dv_dong_number").hasClass("open") ;
                if ( has ) {
                    $("#dv_dong_number").removeClass("open") ; 
                    $(".slide-hddn-List").css("display", "none")
                } else {
                    $("#dv_dong_number").removeClass("open").addClass("open"); 
                    $(".slide-hddn-List").css("display", "flex")
                }
            }) ;

            $("div[id^=dnum_]").click(function() {
                $("div[id^=dnum_]").each(function() {
                    $(this).removeClass("selected") ; 
                }) ;
                $(this).addClass("selected") ; 
                $("#dv_dongnm").text($(this).text()) ;
            }) ;

            fn_set_data() ; 
            /* 제일처음 등록정보 로드 */ 
            fn_pageLoad("310") ;
        }) ;

    </script>
