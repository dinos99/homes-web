<section class="first">
    <div class="title">지역/단지구분 선택</div>
    <div class="cont first bg-gray">
        <div class="label"> 지역 </div>
        <div class="fields">
            <div class="btn-select no-max-width" id="btn_popArea">
                <div class="btn-select-text"> 
                    <span id="p_brk_sdnm">서울특별시</span> &gt; 
                    <span id="p_brk_sggnm">송파구</span> &gt;
                    <span id="p_brk_emdnm">잠실동</span>
                </div>
                <div class="btn-select-arrow"><img src="/images/V.png" alt=""></div>
            </div>
        </div>
    </div>
    <div class="cont bg-gray">
        <div class="label"> 단지구분 </div>
        <div class="fields" id="btn_chk_complex">
            <button type="button" class="hs-check-button active" id="btn_cpx_000">전체</button>
            <button type="button" class="hs-check-button" id="btn_cpx_111">아파트</button>
            <button type="button" class="hs-check-button" id="btn_cpx_112">주상복합</button>
            <button type="button" class="hs-check-button" id="btn_cpx_113">오피스텔</button>
            <button type="button" class="hs-check-button" id="btn_cpx_119">레지던스</button>
            <button type="button" class="hs-check-button" id="btn_cpx_114">빌라/연립</button>
            <button type="button" class="hs-check-button" id="btn_cpx_117">도시형 생활주택</button>
            <button type="button" class="hs-check-button" id="btn_cpx_118">타운하우스</button>
            <button type="button" class="hs-check-button" id="btn_cpx_999">미분류</button>
        </div>
    </div>
    <div class="cont bg-gray">
        <div class="label separate c-red"> 안내 </div>
        <div class="desc info-text">
            <p>
                <span>단지 등록후, 해당</span>
                <span class="c-red">단지 정보에서 보유한 호실(물건)을 추가하고 이를 매물로 등록</span>
                <span>할 수 있습니다.(단지 내 상가도 단지에 포함되어 등록가능합니다.)</span>
            </p>
            <p>
                <span class="c-red">집합건물은 모두 기본적으로 [미분류]상태로 표시</span>
                <span>되며, 단지 등록과정에서 직접 부동산구분을 선택하시면,</span>
                <span class="c-red">선택한 구분에 따라 단지포함여부가 판단</span><span>되고</span>
            </p>
            <p>
                <span class="c-red">홈즈평점이 제공</span><span>됩니다.</span>
            </p>
        </div>
    </div>
</section>

<section id="sec_cplxList">
    <div class="title">단지 선택</div>
    <div id="no_complex" class="cont first justify-center bg-gray">
        해당 지역에 등록된 단지가 없습니다.
    </div>
</section>
