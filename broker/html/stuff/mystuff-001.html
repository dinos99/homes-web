<!doctype html>
<html lang="ko" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈즈프로 나의물건</title>
    
    <link rel="icon" href="/images/logo_homes_pro_32.png" type="image/x-icon">
    <link rel="shortcut icon" href="/images/logo_homes_pro_32.png" type="image/x-icon">

    <!-- bootstrap 5.3.5 -->    
    <script src="/js/extern/bootstrap-5.3.5/assets/js/color-modes.js"></script>
    <link href="/js/extern/bootstrap-5.3.5/assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- bootstrap icon-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/bootstrap/modal.css">

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/variables.css">

    <link rel="stylesheet" href="/css/homes.broker.style.css">
    <style>
      .container .inner { gap: 30px; }
    </style>
  </head>
  <body class="no-scroll">
    <!-------------------------------------------- header------------------------------------- -->
    <header id="homes_Header">
    </header>
    <!-------------------------------------------- header------------------------------------- -->
    <!-------------------------------------------- main------------------------------------- -->
    <!-------------------------------------------- setup------------------------------------- -->
    <div class="top-bar">
        <div class="left">
            <p class="title">설정</p>
            <div class="top-search-wrapper">
                <button class="hs-button w-100px">
                    <span>물건관리</span><span class="mx-1 c-red">0</span>
                </button>
                <button class="hs-button w-100px">
                    <span>매물관리</span><span class="mx-2 c-red">0</span>
                </button>
                <button class="hs-button w-100px"><span>중개사무소</span></button>
                <div class="sepa-22"></div>
                <button class="hs-button w-100px"><span>계약매물</span></button>
                <button class="hs-button w-100px"><span>종료매물</span></button>
                <div class="sepa-22"></div>

                <div id="btn_setup_01" class="btn-select w-100px">
                    <div class="btn-select-text">물건 구분</div>
                    <div class="btn-select-arrow"><img src="/images/V.png" alt="" /></div>
                </div>
                <div class="search-input">
                    <input type="text" placeholder="검색" id="p_keyword">
                    <button class="img-btn">
                        <img src="/images/magnifier.png" alt="">
                    </button>
                </div>
            </div>
        </div>
        <div class="right">
            <button id="btn_stuff_manage" class="hs-button btn-blue check-round-white">물건등록</button>
            <button id="btn_help_stuff" class="hs-button btn-lime play">도움말</button>
        </div>
    </div>
    <div class="container2">
        <div class="map-container">
            <!-------------------------------------------- map------------------------------------- -->
            <img src="/images/sample-map.png" alt="">
            <div class="radius300">
                <div class="flex">반경 300m 위치 <img src="/images/check-round.png" alt=""></div>
                <div class="hide">
                    <p>중개사의 매물보호를</p>
                    <p>위해 매물의 정확한 </p>
                    <p>위치는 <span class="red">반경 300m</span></p>
                    <p> <span class="red">내에 존재</span>합니다.</p>
                </div>
            </div>
            <div class="region-wrapper">
                <div class="region-img"><img src="/images/location-blue.png" alt=""> 서울시</div>
                <div class="region-img">송파구</div>
                <div class="region-text">잠실동</div>
                <div class="listings-mini bg-d5">단지</div>
            </div>
            <div class="realtor"><img src="/images/home-black.png" alt="">
                <div class="left-bubble">중개사무소</div>
            </div>
            <div class="hori-btn-plusminus">
                <button><img src="/images/plus-dark.png" alt=""></button>
                <button><img src="/images/minus-dark.png" alt=""></button>
            </div>
            <div class="eye-hide"><img src="/images/eye-hide.png" alt="">
                <div class="left-bubble">매물 없는 단지 숨김</div>
            </div>
            <div class="unit-hide">물건
                <div class="left-bubble">물건댠위 표기</div>
            </div>
            <!-------------------------------------------- map------------------------------------- -->
        </div>
        <!-------------------------------------------- map List------------------------------------- -->        
        <div class="right-bar">
            <div class="top">
                <p>전체 물건(0/0)</p>
                <div class="checkbox-container">
                    <input type="checkbox" id="p_chk_except_map" class="custom-checkbox" checked="checked">
                    <label for="p_chk_except_map" class="checkbox-label">
                    <span class="checkbox-icon"></span>
                    <span class="checkbox-text c-white">지도 외 선택</span>
                </label>
                </div>
            </div>
            <div class="info-wrapper">
                <section id="sec_stuffList">
                    <div id="dv_cplxList"></div>
                </section>
                <div class="no-item">
                    <img src="/images/no-item.png" alt="">
                    <p>검색된 매물이 없습니다.</p>
                </div>
            </div>
        </div>
        <!-------------------------------------------- map List------------------------------------- -->
    </div>
    <!-------------------------------------------- setup------------------------------------- -->
    <!-------------------------------------------- main------------------------------------- -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="/js/common/homes-event-broker.js"></script>
    <script src="/js/common/homes-comm.js"></script>
    <script type="text/javascript">
        var broker = {} ; 
        var stuff = {
            param: {},
            data: {}
        }

        var pop_close = ( param ) => {
            $("iframe").remove() ;
            fn_get_stuff_List() ;
        }

        var fn_get_stuff_List = () => {
            broker = store.getItem("user") ; 
            broker.brkno = broker.userno ; 
            network.post("/stuff/stuffList", {
            }).then(response => {
                stuff.data = response.data ; 
                fn_set_List(stuff.data) ; 
            });
        }
        var fn_set_cplxList = ( cplxList ) => {
            $(".no-item").removeClass("hidden").addClass("hidden") ; 
            $("#dv_cplxList").empty() ; 
            cplxList.forEach( data => {
                console.log( data ) ; 
                var vwrap = $("<div id='dv_buld_" + data.stuffno + "' class='vertical-wrapper white-bg bd-5'/>") ;
                var stitle = $("<div class='justify-between'/>") ;
                var dv_hshld = $("<div/>") ; 
                var span_3  = $("<span class='gray fs-13 fw-600' />") ; 
                if ( data.hppscd == 'HPS113') span_3.text("호실") ; 
                else span_3.text("세대") ; 
                var span_4 = $("<span class='gray mx-1'/>") ; 
                span_4.text(homes_comm.util.fn_format_number(data.hshldco)) ;
                var span_5 = $("<span class='gray'/>") ;
                var span_6 = $("<span class='gray mx-1'/>") ;
                span_5.text("• 단지동") ; 
                span_6.text(homes_comm.util.fn_format_number(data.buldco)) ; 
                dv_hshld.append(span_3) ;
                dv_hshld.append(span_4) ;
                dv_hshld.append(span_5) ;
                dv_hshld.append(span_6) ;
                var dv_xxz = $("<div class='xxz mb4'/>") ; 
                var dv_Left = $("<div class='left'/>") ; 
                var p_1 = $("<p/>") ; 
                var p_2 = $("<p/>") ; 
                var p_3 = $("<p class='last'/>") ; 
                p_1.html("등록물건 <span class='c-red'/>0</span/>") ; 
                p_2.html("등록매물 <span class='c-red'/>0</span/>") ; 
                p_3.html("계약만료 <span class='c-red'/>0</span/>") ; 
                var dv_cusel = $("<div class='custom-select'/>") ; 
                var dv_cuselVal = $("<div class='selected-value'/>") ; 
                dv_cuselVal.append("<img src='/images/V.png' class='arrow' alt='V'/>") ; 
                dv_cusel.append(dv_cuselVal) ;
                dv_Left.append(p_1) ; 
                dv_Left.append(p_2) ; 
                dv_Left.append(p_3) ; 
                dv_Left.append(dv_cusel) ; 
                dv_xxz.append(dv_Left) ; 
                var sp = $("<p class='title2 fs-14 fw-600' />") ;
                var span_1 = $("<span class='hs-badge " + data.bgcolor + "'/>") ;
                var span_2 = $("<span class='mx-1'/>") ; 
                var imgLoc = $("<div class='img-box' />") ; 
                imgLoc.html("<img src='/images/lock.png' alt='자물쇠' />")
                
                span_1.text(data.hppsnm) ; 
                span_2.text(data.buldnm) ; 
                sp.append(span_1) ;
                sp.append(span_2) ;

                stitle.append(sp) ;
                stitle.append(imgLoc) ;
                vwrap.append(stitle) ; 
                vwrap.append(dv_hshld) ; 
                vwrap.append(dv_xxz) ; 
                
                vwrap.click(function() {
                    fn_set_data(data) ;
                    fn_pop_info(data) ;
                }) ; 
                
                $("#dv_cplxList").append(vwrap) ; 


            }) ; 
        }
        var fn_set_List = ( data ) => {
            var cplxList = data.cplxList ;
            if ( !!cplxList && cplxList.length > 0 ) { 
                fn_set_cplxList( cplxList ) ; 
            }
        }

        var fn_pop_info = ( data ) => {
            var ifrm = $("#ifrm_stuff_info") ; 
            if ( ifrm.length > 0 ) {
                ifrm.attr("src", "/html/stuff/mystuff-003.html") ;
            } else {
                var ifrm = $("<iframe class='pop-ifrm info' id='ifrm_stuff_info' src='/html/stuff/mystuff-003.html' />") ; 
                $("body").append(ifrm) ;
            }
        }
        var fn_set_data = ( data ) => {
            stuff.data = data ; 
            $("div[id^=dv_buld_]").removeClass("active") ; 
            $("#dv_buld_" + data.buldno).addClass("active")
        }

        var fn_get_param = () => {
            return stuff.data ; 
        }

        $(document).ready(function() {
            broker = store.getItem("user") ; 
            broker.brkno = broker.userno ; 
            fn_page_init("T03") ;

            $("#btn_stuff_manage").click(function() {
                var ifrm = $("<iframe class='pop-ifrm' id='ifrm_stuff_manage' src='/html/stuff/mystuff-002.html' />") ; 
                $("body").append(ifrm) ;
            }) ;
        }) ;


        fn_get_stuff_List() ; 

    </script>
</body>
</html>
