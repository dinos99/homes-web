<!doctype html>
<html lang="ko" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#712cf9">
    <title>리얼홈즈 프로</title>

    <!-- bootstrap 5.3.5 -->    
    <script src="/js/extern/bootstrap-5.3.5/assets/js/color-modes.js"></script>
    <link href="/js/extern/bootstrap-5.3.5/assets/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/bootstrap/modal.css">

    <!-- KAKAo Login API -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js" integrity="sha384-dok87au0gKqJdxs7msEdBPNnKSRT+/mhTVzq+qOhcL464zXwvcrpjeWvyj1kCdq6" crossorigin="anonymous"></script>

    <!-- services,clusterer,drawing 라이브러리 불러오기 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3683e4f8faad0637b8a7db5fc23179bd&libraries=services,clusterer,drawing"></script>

    <!-- 다음 우편번호 검색 API -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/custom.css">

  </head>
  <body>
    <div class="p-3">
      <button type="button" class="btn btn-primary" id="btn_homesLogin">홈즈프로 로그인</button>
      <button type="button" class="btn btn-success" id="btn_reg_broker">중개사무소 등록(대표)</button>
      <button type="button" class="btn btn-success" id="btn_reg_inbroker">직원 승인요청</button>
      <button type="button" class="btn btn-secondary" id="btn_popEsate">부동산구분 팝업</button>
      <!--
      <button type="button" class="btn btn-secondary" id="btn_s_area">지역검색</button>
      -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <script src="/js/common/homes-comm.js"></script>
  </body>

  <script type="text/javascript">
    var fn_page_onLoad = () => {
      $("#btn_homesLogin").click(function() {
        homes.fn_popLogin() ;
      }) ;

      $("#btn_reg_broker").click(function() {
        var is_Login = fn_isLogin() ; 
        if ( is_Login ) {
          $("#pop-broker-input").remove() ; 
          var mcont = $("<div id='pop-broker-input' class='popup-container'/>") ; 
          $("body").append(mcont) ; 
          mcont.load("/html/broker/broker-input.html", () => {   
              fn_popLoadCompleted({
                "brokerTy": "BRT001" /* 대표공인중개사 */ 
              }) ;
          }) ;
        }
      }) ;

      $("#btn_popEsate").click(function() {
        popup.popOpenEstate() ;
      }) ; 
    }
  </script>


</html>
